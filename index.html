<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>대한민국 관광명소 - K-여행 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f7f4; --card: #ffffff; --text: #1a1a2e; --t2: #6b7280; --t3: #9ca3af;
            --bd: #e8e6e1; --ac: #e74c3c; --ac2: #f97316;
            --shadow: 0 2px 12px rgba(0,0,0,0.05); --shadow-h: 0 6px 24px rgba(0,0,0,0.1);
            --rd: 14px; --rs: 8px; --rf: 9999px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans KR',-apple-system,sans-serif;overflow:hidden;background:var(--bg);height:100vh;color:var(--text)}

        #map {
            position:fixed; inset:0; z-index:1;
            filter: saturate(1.08) hue-rotate(-2deg);
        }
        .leaflet-control-zoom a{
            background:var(--card)!important;color:var(--text)!important;
            border:1px solid var(--bd)!important;
            width:34px!important;height:34px!important;line-height:34px!important;
            font-size:16px!important;box-shadow:var(--shadow)!important;
        }
        .leaflet-control-attribution{background:rgba(255,255,255,0.8)!important;color:var(--t3)!important;font-size:10px!important}
        .leaflet-control-attribution a{color:var(--t3)!important}

        /* 헤더 */
        #header {
            position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:1000;
            background:rgba(255,255,255,0.88); backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.5);
            padding:8px 20px; border-radius:var(--rf);
            box-shadow:0 4px 24px rgba(0,0,0,0.06);
            text-align:center; pointer-events:none;
        }
        #header h1{font-size:14px;font-weight:700;letter-spacing:-0.3px}
        #header h1 span{font-weight:300;color:var(--t3)}

        /* 검색창 */
        #search-wrap {
            position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:1000;
            width:92%; max-width:420px;
            background:rgba(255,255,255,0.9); backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.5);
            border-radius:var(--rf);
            box-shadow:0 4px 24px rgba(0,0,0,0.05);
            display:flex; align-items:center;
            padding:3px 3px 3px 16px;
            transition:box-shadow 0.3s;
        }
        #search-wrap:focus-within {
            box-shadow:0 4px 24px rgba(231,76,60,0.1),0 0 0 3px rgba(231,76,60,0.06);
        }
        #search-input{
            flex:1;background:none;border:none;outline:none;
            color:var(--text);font-size:14px;font-family:inherit;padding:8px 0;
        }
        #search-input::placeholder{color:var(--t3);font-weight:300}
        #search-btn{
            padding:8px 20px;border:none;border-radius:var(--rf);
            background:var(--ac);color:#fff;
            font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;flex-shrink:0;
            transition:all 0.2s;
        }
        #search-btn:hover{background:#c0392b;transform:translateY(-1px)}

        /* 필터바 */
        #filter-bar {
            position:fixed; top:120px; left:50%; transform:translateX(-50%); z-index:1000;
            display:flex; gap:5px; flex-wrap:nowrap;
            width:92%; max-width:420px; overflow-x:auto;
            padding:2px 0;
            -webkit-overflow-scrolling:touch;
        }
        #filter-bar::-webkit-scrollbar{display:none}
        .filter-btn {
            padding:5px 14px; border:1px solid var(--bd); border-radius:var(--rf);
            background:rgba(255,255,255,0.85); backdrop-filter:blur(8px);
            color:var(--t2); font-size:11px; font-weight:500; cursor:pointer;
            font-family:inherit; white-space:nowrap; flex-shrink:0;
            transition:all 0.2s;
        }
        .filter-btn:hover{border-color:var(--ac);color:var(--text)}
        .filter-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}

        /* 검색 결과 */
        #results{
            position:fixed; top:165px; left:50%; transform:translateX(-50%); z-index:1000;
            width:92%; max-width:420px;
            max-height:calc(100vh-200px); overflow-y:auto; display:none;
        }
        #results::-webkit-scrollbar{width:3px}
        #results::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
        .result-item{
            background:rgba(255,255,255,0.92); backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.5);
            padding:12px 16px; margin-bottom:5px; border-radius:var(--rd);
            cursor:pointer; transition:all 0.25s;
            animation:rfade 0.25s ease;
        }
        @keyframes rfade{from{opacity:0;transform:translateY(-6px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
        .result-item:hover{background:rgba(255,255,255,0.98);border-color:var(--ac);transform:translateX(3px)}
        .result-item .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
        .result-item h3{font-size:14px;font-weight:600}
        .result-item .badge{font-size:9px;padding:2px 8px;border-radius:var(--rf);color:#fff;flex-shrink:0}
        .result-item .r{font-size:11px;color:var(--t2);margin-top:3px;display:flex;align-items:center;gap:6px}
        .result-item .r .dist{color:var(--ac2);font-size:10px;font-weight:500}

        /* 상세 패널 - 하단 시트 */
        #detail-overlay{
            position:fixed;inset:0;z-index:2000;
            background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);
            display:none;
        }
        #detail-panel{
            position:fixed;bottom:0;left:0;right:0;z-index:2001;
            background:rgba(255,255,255,0.96);backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border-radius:20px 20px 0 0;
            box-shadow:0 -8px 40px rgba(0,0,0,0.1);
            padding:20px 24px 28px;
            max-height:75vh;overflow-y:auto;
            transform:translateY(100%);
            transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
        }
        #detail-panel.open{transform:translateY(0)}
        #detail-panel .handle{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 14px}
        #detail-panel h2{font-size:20px;font-weight:700;margin-bottom:2px}
        #detail-panel .cat-tag{display:inline-block;padding:2px 10px;border-radius:var(--rf);font-size:10px;font-weight:600;color:#fff;margin-bottom:4px}
        #detail-panel .r-line{font-size:13px;color:var(--t2);margin-bottom:8px}
        #detail-panel .d-text{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:8px}
        #detail-panel .t-box{
            font-size:13px;line-height:1.5;color:var(--t2);
            padding:10px 14px;background:#fafaf9;
            border-left:3px solid var(--ac);
            border-radius:0 var(--rs) var(--rs) 0;margin-bottom:12px;
        }
        #detail-panel .t-box b{color:var(--ac);font-weight:600}
        #detail-panel .actions{display:flex;gap:8px;flex-wrap:wrap}
        #detail-panel .actions a{
            flex:1;padding:10px 16px;border-radius:var(--rs);
            text-decoration:none;font-size:13px;font-weight:600;
            text-align:center;transition:all 0.2s;
        }
        #detail-panel .actions .navi{background:#03c75a;color:#fff}
        #detail-panel .actions .navi:hover{opacity:0.9}
        #detail-panel .actions .wish{background:#fef2f2;color:var(--ac);cursor:pointer}
        #detail-panel .actions .wish:hover{background:#fee2e2}
        #detail-panel .coord-text{font-size:10px;color:var(--t3);margin-top:10px}
        .close-detail{
            position:absolute;top:12px;right:16px;
            background:none;border:none;font-size:22px;color:var(--t3);
            cursor:pointer;transition:color 0.2s;
        }
        .close-detail:hover{color:var(--text)}

        #current-loc-btn{
            position:fixed;bottom:24px;right:16px;z-index:1000;
            width:40px;height:40px;border-radius:50%;
            background:var(--card);border:1px solid var(--bd);
            box-shadow:var(--shadow);cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            font-size:18px;transition:all 0.2s;
        }
        #current-loc-btn:hover{box-shadow:var(--shadow-h);transform:scale(1.05)}

        #counter{
            position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;
            background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.3);
            padding:5px 16px;border-radius:var(--rf);
            font-size:11px;color:var(--t2);pointer-events:none;
        }
        #counter span{font-weight:700;color:var(--text)}

        /* 팝업 */
        .custom-popup .leaflet-popup-content-wrapper{
            background:rgba(255,255,255,0.95);backdrop-filter:blur(24px);
            border-radius:var(--rd);box-shadow:0 12px 48px rgba(0,0,0,0.1);
            border:1px solid rgba(255,255,255,0.3);padding:2px;
        }
        .custom-popup .leaflet-popup-tip{background:rgba(255,255,255,0.95)}
        .custom-popup .leaflet-popup-close-button{color:var(--t3)!important;top:4px!important;right:4px!important}
        .popup-c{padding:4px 2px;min-width:180px;max-width:260px}
        .popup-c h3{font-size:15px;font-weight:700;margin-bottom:2px}
        .popup-c .tag{display:inline-block;padding:1px 8px;border-radius:var(--rf);font-size:9px;color:#fff;margin-bottom:3px}
        .popup-c .r{font-size:11px;color:var(--t2);margin-bottom:4px}
        .popup-c .d{font-size:12px;line-height:1.5;color:var(--t2)}
        .popup-c .t{font-size:11px;color:var(--text);padding:6px 10px;background:#fafaf9;border-left:2px solid var(--ac);border-radius:0 6px 6px 0;margin-top:4px}
        .popup-c .t b{color:var(--ac)}

        @media(max-width:600px){
            #header{top:10px;padding:6px 14px}#header h1{font-size:12px}
            #search-wrap{top:60px}#search-input{font-size:13px}#search-btn{padding:7px 16px;font-size:12px}
            #filter-bar{top:106px;gap:4px}.filter-btn{padding:4px 11px;font-size:10px}
            #results{top:148px}
            #detail-panel{padding:16px 16px 22px}
            #detail-panel h2{font-size:17px}
            #current-loc-btn{bottom:70px;width:36px;height:36px;font-size:16px}
            #counter{font-size:10px;padding:4px 12px}
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="header"><h1>🇰🇷 K-여행 지도 <span>|</span> 대한민국 관광명소</h1></div>
    <div id="search-wrap">
        <input type="text" id="search-input" autocomplete="off" placeholder="명소나 지역을 검색...">
        <button id="search-btn">검색</button>
    </div>
    <div id="filter-bar">
        <button class="filter-btn active" data-cat="all">전체</button>
        <button class="filter-btn" data-cat="역사">🏛️ 역사</button>
        <button class="filter-btn" data-cat="자연">🌿 자연</button>
        <button class="filter-btn" data-cat="문화">🎭 문화</button>
        <button class="filter-btn" data-cat="쇼핑">🛍️ 쇼핑</button>
        <button class="filter-btn" data-cat="맛집">🍜 맛집</button>
        <button class="filter-btn" data-cat="랜드마크">🗼 랜드마크</button>
        <button class="filter-btn" data-cat="기타">📌 기타</button>
    </div>
    <div id="results"></div>
    <div id="counter"><span id="cn">40</span>개 명소</div>
    <button id="current-loc-btn" title="내 위치" onclick="locateMe()">📍</button>

    <!-- 상세 패널 -->
    <div id="detail-overlay" onclick="closeDetail()"></div>
    <div id="detail-panel">
        <button class="close-detail" onclick="closeDetail()">✕</button>
        <div class="handle"></div>
        <span class="cat-tag" id="dt-cat"></span>
        <h2 id="dt-name"></h2>
        <div class="r-line" id="dt-region"></div>
        <div class="d-text" id="dt-desc"></div>

            <a class="navi" id="dt-navi" target="_blank">📍 네이버 길찾기</a>
            <button class="wish" id="dt-wish" onclick="toggleWish()">🤍 찜하기</button>
        </div>
        <div class="coord-text" id="dt-coords"></div>

            {n:"석굴암",r:"경주",a:35.7951,o:129.3492,c:"역사",d:"통일신라 불교 조각 예술의 정수. UNESCO 세계문화유산.",t:"사진 촬영이 제한되니 눈에 담아오세요."},
            {n:"안동하회마을",r:"경북",a:36.5392,o:128.5172,c:"문화",d:"조선 양반 마을 원형 보존. UNESCO 세계문화유산.",t:"낙동강에서 배 타고 마을 전체 조망! 탈박물관도 필수 방문."},
            {n:"전주한옥마을",r:"전북",a:35.8138,o:127.1485,c:"문화",d:"한옥과 한식(비빔밥)의 본고장. 전통 문화 체험의 최적지.",t:"한복 대여해서 마을 거니는 게 인기! 전동성당도 함께 방문."},
            {n:"대구동성로",r:"대구",a:35.8692,o:128.5952,c:"쇼핑",d:"대구의 명동. 패션과 먹거리 중심지.",t:"서문시장 야시장 구경! 납작만두와 치맥이 대구 대표 야식."},
            {n:"대전엑스포공원",r:"대전",a:36.3767,o:127.3844,c:"문화",d:"1993 대전엑스포 개최지. 한빛탑이 상징.",t:"한빛탑 야경이 아름다움! 대전시립미술관도 함께 방문하세요."},
            {n:"울산대왕암공원",r:"울산",a:35.5022,o:129.4292,c:"자연",d:"동해안 절경. 기암괴석과 소나무가 어우러진 해안공원.",t:"해돋이 명소! 대왕암 해상 데크길 산책이 정말 일품입니다."},
            {n:"인천차이나타운",r:"인천",a:37.4778,o:126.6190,c:"문화",d:"한국 최초의 차이나타운. 짜장면의 발상지.",t:"짜장면 박물관 방문! 개항장 거리도 함께 둘러보세요."},
            {n:"광주국립아시아문화전당",r:"광주",a:35.1467,o:126.9184,c:"문화",d:"아시아 문화 교류 중심. 현대적 건축물.",t:"무료 전시 많음! 광주비엔날레 전시관도 인근에 있어요."},
            {n:"설악산국립공원",r:"강원",a:38.1195,o:128.4642,c:"자연",d:"한국의 알프스. 웅장한 암봉과 단풍 아름다운 명산.",t:"케이블카 타고 권금성까지! 10월 단풍 시즌이 절정입니다."},
            {n:"남해군",r:"경남",a:34.8140,o:127.9289,c:"자연",d:"다도해의 아름다운 풍경. 독일마을과 청정 바다.",t:"독일마을에서 이국적 풍경! 가천 다랭이마을도 함께 추천."},
            {n:"통영케이블카",r:"경남",a:34.8315,o:128.4227,c:"자연",d:"한려해상국립공원을 한눈에 케이블카.",t:"스카이워크도 체험! 통영 대표 먹거리 충무김밥과 굴 요리."},
            {n:"순천만국가정원",r:"전남",a:34.9258,o:127.4947,c:"자연",d:"세계적 생태 관광지. 갈대밭과 S자 수로 장관.",t:"일몰 때 갈대밭 황금빛 순간이 최고! 용산전망대까지 꼭."},
            {n:"제부도",r:"경기",a:37.1945,o:126.6313,c:"자연",d:"하루 두 번 바닷길이 열리는 신비한 섬.",t:"물때표 꼭 확인! 해변에서 조개잡이 체험도 할 수 있어요."},
            {n:"용인에버랜드",r:"경기",a:37.2935,o:127.2070,c:"랜드마크",d:"한국 최대 테마파크. 사계절 다양한 축제.",t:"주말에는 꼭 미리 예약! 판다월드 푸바오가 인기 만점입니다."},
            {n:"포항죽도시장",r:"경북",a:36.0180,o:129.3657,c:"맛집",d:"과메기와 물회의 본고장. 포항 대표 전통시장.",t:"과메기 정식과 물회가 시장의 대표 메뉴! 꼭 맛보세요."},
            {n:"속초관광수산시장",r:"강원",a:38.2072,o:128.5921,c:"맛집",d:"강원도 대표 시장. 오징어순대와 닭강정 유명.",t:"닭강정과 오징어순대 필수 코스! 속초해수욕장도 함께."},
            {n:"철원 DMZ",r:"강원",a:38.2220,o:127.2140,c:"역사",d:"한반도 분단의 현장. 평화와 생태의 상징.",t:"출입증 필요! 철원 주상절리와 직탕폭포도 함께 구경."},
            {n:"천안독립기념관",r:"충남",a:36.7803,o:127.2217,c:"역사",d:"한국 독립운동의 역사를 기리는 대표 기념관.",t:"입장료 무료! 천안 삼거리도 함께 방문해보세요."},
            {n:"공주무령왕릉",r:"충남",a:36.4613,o:127.1178,c:"역사",d:"백제 시대 왕릉. 금관과 장신구 등 귀중 유물 출토.",t:"국립공주박물관에서 유물 전시 중! 공산성도 함께 방문."},
            {n:"부여백제문화단지",r:"충남",a:36.2748,o:126.9127,c:"역사",d:"백제 역사와 문화를 재현한 대규모 테마파크.",t:"부소산성과 낙화암도 함께! 백제문화제(9-10월)가 최고."},
            {n:"충주호",r:"충북",a:36.9712,o:128.0019,c:"자연",d:"청풍호반과 유람선이 아름다운 충북의 호수.",t:"유람선 타고 호수 둘러보기! 충주 탄금대도 방문해보세요."},
            {n:"단양고수동굴",r:"충북",a:36.9578,o:128.3630,c:"자연",d:"천연동굴의 신비를 체험하는 충북 대표 명소.",t:"도담삼봉과 만천하 스카이워크도 함께 즐기세요!"},
        ];

        // ===== 전역 변수 =====
        var map, markers = [], _curLat, _curLng, _wish = [], _selIdx = -1;
        var catFilter = "all";
        var CC = {"역사":"#e74c3c","랜드마크":"#f97316","문화":"#8b5cf6","쇼핑":"#9b59b6","자연":"#2ecc71","맛집":"#f59e0b","기타":"#3498db"};

        // 찜하기 로드
        try{var w=localStorage.getItem("ktour_wish");if(w)_wish=JSON.parse(w)}catch(e){}

        function $(i){return document.getElementById(i)}

        // ===== 지도 초기화 =====
        map = L.map('map',{center:[36.0,127.8],zoom:7,minZoom:6,maxZoom:14,zoomControl:false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);
        L.control.zoom({position:'bottomright'}).addTo(map);

        // ===== 마커 생성 =====
        D.forEach(function(a, i){
            var c = CC[a.c]||"#8b5cf6";
            var icon = L.divIcon({
                html:'<div style="position:relative;width:28px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2))"><svg width="28" height="40" viewBox="0 0 28 40"><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="'+c+'" stroke="#fff" stroke-width="1.8"/><circle cx="14" cy="13" r="6" fill="#fff"/></svg></div>',
                iconSize:[28,40],iconAnchor:[14,40],popupAnchor:[0,-42],className:''
            });
            var m = L.marker([a.a,a.o],{icon}).addTo(map);
            m._idx = i;
            var pop = '<div class="popup-c"><h3>'+a.n+'</h3><span class="tag" style="background:'+c+'">'+a.c+'</span><div class="r">📍 '+a.r+'</div><div class="d">'+a.d+'</div><div class="t"><b>💡 TIP</b><br>'+a.t+'</div></div>';
            m.bindPopup(pop,{className:'custom-popup',maxWidth:300,closeButton:true});
            m.on('click',function(){showDetail(this._idx)});
            markers.push(m);
        });
        $("cn").textContent = D.length;

        // ===== 현재 위치 =====
        function locateMe(){
            if(!navigator.geolocation){alert("GPS를 지원하지 않는 브라우저입니다.");return}
            $("current-loc-btn").textContent = "⏳";
            navigator.geolocation.getCurrentPosition(function(p){
                _curLat = p.coords.latitude;
                _curLng = p.coords.longitude;
                map.setView([_curLat,_curLng],12,{animate:true});
                L.circleMarker([_curLat,_curLng],{radius:8,color:"#4f8cf7",fillColor:"#4f8cf7",fillOpacity:0.3}).addTo(map);
                $("current-loc-btn").textContent = "📍";
                // 주변 명소 검색
                findNearby();
            }, function(){
                alert("위치를 가져올 수 없습니다.");
                $("current-loc-btn").textContent = "📍";
            });
        }

        function findNearby(){
            if(!_curLat||!_curLng) return;
            var sorted = D.map(function(a,i){return {idx:i,dist:getDistance(_curLat,_curLng,a.a,a.o)}}).sort(function(a,b){return a.dist-b.dist});
            var html = '<div style="padding:10px 14px;margin-bottom:6px;background:rgba(255,255,255,0.92);border-radius:14px;color:var(--ac2);font-size:13px;font-weight:600">📍 내 주변 명소</div>';
            sorted.slice(0,5).forEach(function(s){
                var a = D[s.idx], c = CC[a.c]||"#8b5cf6";
                var d = s.dist < 1 ? (Math.round(s.dist*1000)+"m") : (s.dist.toFixed(1)+"km");
                html += '<div class=result-item onclick="showDetail('+s.idx+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span><span class=dist>'+d+'</span></div></div>';
            });
            $("results").innerHTML = html;
            $("results").style.display = "block";
        }

        function getDistance(lat1,lng1,lat2,lng2){
            var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
            var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
            return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
        }

        // ===== 필터 =====
        document.querySelectorAll(".filter-btn").forEach(function(btn){
            btn.addEventListener("click",function(){
                document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});
                this.classList.add("active");
                catFilter = this.getAttribute("data-cat");
                applyFilter();
            });
        });

        function applyFilter(){
            markers.forEach(function(m){
                var a = D[m._idx];
                if(catFilter === "all") m.setOpacity(1);
                else m.setOpacity(a.c === catFilter ? 1 : 0.3);
            });
        }

        // ===== 검색 =====
        function doSearch(){
            var q = $("search-input").value.trim().toLowerCase();
            if(!q){$("results").style.display="none";return}
            var f = D.filter(function(a){return a.n.toLowerCase().indexOf(q)>=0||a.r.toLowerCase().indexOf(q)>=0||a.c.toLowerCase().indexOf(q)>=0||a.d.toLowerCase().indexOf(q)>=0});
            var html = "";
            if(!f.length){html='<div style="padding:14px;text-align:center;color:var(--t3)">😅 검색 결과가 없습니다</div>'}
            else{
                f.forEach(function(a){
                    var c=CC[a.c]||"#8b5cf6";
                    html+='<div class=result-item onclick="showDetail('+D.indexOf(a)+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span></div></div>';
                });
            }
            $("results").innerHTML=html;
            $("results").style.display="block";
        }

        $("search-btn").addEventListener("click",doSearch);
        $("search-input").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
        var dt;
        $("search-input").addEventListener("input",function(){clearTimeout(dt);dt=setTimeout(doSearch,250)});
        $("results").addEventListener("click",function(e){e.stopPropagation()});
        document.addEventListener("click",function(){$("results").style.display="none"});

        // ===== 상세 패널 =====
        function showDetail(i){
            _selIdx = i;
            var a = D[i], c = CC[a.c]||"#8b5cf6";
            $("dt-cat").textContent = a.c;
            $("dt-cat").style.background = c;
            $("dt-name").textContent = a.n;
            $("dt-region").textContent = "📍 " + a.r;
            $("dt-desc").textContent = a.d;
            $("dt-tip").innerHTML = "<b>💡 여행 팁</b><br>" + a.t;
            $("dt-navi").href = "https://map.naver.com/p/directions/"+a.a+","+a.o+","+encodeURIComponent(a.n)+"?c="+a.o+","+a.a+",15,0,0,0,dh";
            $("dt-coords").textContent = "위도: "+a.a+", 경도: "+a.o;
            // 찜 상태
            var isW = _wish.indexOf(i) >= 0;
            $("dt-wish").textContent = isW ? "❤️ 찜 완료" : "🤍 찜하기";
            $("detail-overlay").style.display = "block";
            $("detail-panel").classList.add("open");
        }

        function closeDetail(){
            $("detail-overlay").style.display = "none";
            $("detail-panel").classList.remove("open");
        }

        function toggleWish(){
            if(_selIdx < 0) return;
            var idx = _wish.indexOf(_selIdx);
            if(idx >= 0){
                _wish.splice(idx,1);
                $("dt-wish").textContent = "🤍 찜하기";
            } else {
                _wish.push(_selIdx);
                $("dt-wish").textContent = "❤️ 찜 완료";
            }
            localStorage.setItem("ktour_wish", JSON.stringify(_wish));
        }

        window.addEventListener("resize",function(){map.invalidateSize()});
    </script>
</body>
</html>
