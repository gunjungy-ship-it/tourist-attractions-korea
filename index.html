canvas { display: block; }

#search-box input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 15px; padding: 6px 0; }

#search-box .icon { color: #888; font-size: 18px; }
#filters { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
#filters button { padding: 7px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: rgba(10,14,26,0.7); color: #aaa; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s; }

#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0e1a; z-index: 9999; color: #4f8cf7; font-size: 18px; font-weight: 300; letter-spacing: 2px; }

@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

// ---- SETUP ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1a);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(15, 12, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0, 0);

// ---- LIGHTS ----

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);

dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);
const hemiLight = new THREE.HemisphereLight(0x4466ff, 0x222233, 0.6);
scene.add(hemiLight);

// ---- COORDINATE FUNCTION ----
const centerLat = 36.0;
const centerLng = 127.8;
const scale = 0.13;

function latLngToPosition(lat, lng) {
    const x = (lng - centerLng) * scale;
    const z = -(lat - centerLat) * scale;
    return { x, z };
}

    const shape = new THREE.Shape();
    pts.forEach((p, i) => {
        const x = (p[0] - centerLng) * scale;
        const y = -(p[1] - centerLat) * scale;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
    });
    
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshPhongMaterial({

function createIsland(lat, lng, color, size) {
    const pos = latLngToPosition(lat, lng);
    const g = new THREE.SphereGeometry(size, 8, 8);
    const m = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.2 });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(pos.x, -0.15, pos.z);
    mesh.scale.y = 0.4;
    return mesh;
}

function createJeju() {
    const pts = [
        [126.2, 33.2], [126.4, 33.15], [126.6, 33.15], [126.8, 33.18],
        [127.0, 33.25], [127.2, 33.35], [127.4, 33.45], [127.5, 33.55],
        [127.4, 33.65], [127.2, 33.7], [127.0, 33.75], [126.8, 33.78],
        [126.6, 33.8], [126.4, 33.8], [126.2, 33.75], [126.0, 33.7],
        [125.9, 33.65], [125.8, 33.6], [125.7, 33.55], [125.6, 33.5],
        [125.55, 33.45], [125.5, 33.4], [125.5, 33.35], [125.55, 33.3],
        [125.6, 33.25], [125.7, 33.2], [125.8, 33.15], [126.0, 33.15],
        [126.2, 33.2],
    ];
    const shape = new THREE.Shape();
    pts.forEach((p, i) => {
        const x = (p[0] - centerLng) * scale;
        const y = -(p[1] - centerLat) * scale;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
    });
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshPhongMaterial({
        color: 0x3a7a4a,
        emissive: 0x0a2a12,
        emissiveIntensity: 0.3,
        shininess: 20,
        side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.rotation.x = Math.PI / 2;
    mesh.position.y = -0.12;
    return mesh;
}

const catColors = {
    historical: 0xe74c3c,
    nature: 0x2ecc71,
    modern: 0x3498db,
    cultural: 0xf39c12,
    food: 0xe67e22,
};

function createMarker(lat, lng, cat, name) {
    const pos = latLngToPosition(lat, lng);
    const color = catColors[cat] || 0xffffff;
    
    const group = new THREE.Group();
    
    const ringGeom = new THREE.RingGeometry(0.08, 0.14, 16);
    const ringMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.4,
        side: THREE.DoubleSide,
        depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    group.add(ring);
    
    const innerGeom = new THREE.RingGeometry(0.02, 0.07, 12);
    const innerMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide,
        depthWrite: false,
    });
    const inner = new THREE.Mesh(innerGeom, innerMat);
    inner.rotation.x = -Math.PI / 2;
    inner.position.y = 0.02;
    group.add(inner);
    
    const dotGeom = new THREE.CircleGeometry(0.03, 8);
    const dotMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
    });
    const dot = new THREE.Mesh(dotGeom, dotMat);
    dot.rotation.x = -Math.PI / 2;
    dot.position.y = 0.03;
    group.add(dot);
    
    const pillarGeom = new THREE.CylinderGeometry(0.01, 0.02, 0.3, 6);
    const pillarMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.15,
    });
    const pillar = new THREE.Mesh(pillarGeom, pillarMat);
    pillar.position.y = 0.15;
    group.add(pillar);
    
    group.position.set(pos.x, -0.2, pos.z);
    group.userData = { name, lat, lng, cat };
    
    return group;
}

// ---- RAYCASTER ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onMouseClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    
    const meshes = [];
    markerGroup.children.forEach(marker => {
        marker.children.forEach(child => {
            if (child.isMesh) {
                meshes.push({ mesh: child, marker });
            }
        });
    });
    
    const intersects = raycaster.intersectObjects(meshes.map(m => m.mesh));
    if (intersects.length > 0) {
        const hit = intersects[0].object;
        const markerObj = meshes.find(m => m.mesh === hit)?.marker;
        if (markerObj && markerObj.userData.name) {
            showInfo(markerObj.userData);
        }
    }
}

window.addEventListener('click', onMouseClick);

// ---- INFO PANEL ----
function showInfo(data) {
    const panel = document.getElementById('info-panel');
    document.getElementById('infoTitle').textContent = data.name;
    const catNames = { historical: '역사', nature: '자연', modern: '현대', cultural: '문화', food: '음식' };
    const catColors2 = { historical: '#e74c3c', nature: '#2ecc71', modern: '#3498db', cultural: '#f39c12', food: '#e67e22' };
    const catDiv = document.getElementById('infoCategory');
    catDiv.innerHTML = '<span class="cat-badge" style="background:' + catColors2[data.cat] + '">' + catNames[data.cat] + '</span>';
    const a = attractions.find(a => a.name === data.name);
    document.getElementById('infoDesc').textContent = a ? a.desc : '';
    document.getElementById('infoCoords').textContent = '위도: ' + data.lat.toFixed(4) + ', 경도: ' + data.lng.toFixed(4);
    panel.classList.remove('hidden');
}

document.getElementById('closePanel').addEventListener('click', () => {
    document.getElementById('info-panel').classList.add('hidden');
});

// ---- FILTER & SEARCH ----
let activeCategory = 'all';
let searchQuery = '';

function updateVisibility() {
    markerGroup.children.forEach(marker => {
        const data = marker.userData;
        const matchCat = activeCategory === 'all' || data.cat === activeCategory;
        const matchSearch = !searchQuery || data.name.includes(searchQuery);
        marker.visible = matchCat && matchSearch;
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        updateVisibility();
    });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    updateVisibility();
});

// ---- ANIMATION LOOP ----
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.01;
    
    markerGroup.children.forEach((marker, i) => {
        const pulse = 1 + 0.15 * Math.sin(time * 2 + i * 0.5);
        marker.children.forEach(child => {
            if (child.isMesh && child.geometry.type === 'RingGeometry') {
                const s = child.geometry.parameters.outerRadius === 0.14 ? pulse : 1;
                if (child.geometry.parameters.outerRadius === 0.14) {
                    child.scale.set(s, s, 1);
                    child.material.opacity = 0.2 + 0.2 * Math.sin(time * 2 + i * 0.5 + 1);
                }
            }
        });
    });
    
    waveRing.rotation.z += 0.002;
    waveRing.material.opacity = 0.04 + 0.04 * Math.sin(time * 0.5);
    
    stars.rotation.y += 0.0002;
    
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('loading').style.display = 'none';
animate();

</script>
