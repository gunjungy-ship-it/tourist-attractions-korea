<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 관광명소 - 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #1a1a2e; color: #fff; }

        #map {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        /* 어두운 지도 스타일을 위한 CSS 오버라이드 */
        .leaflet-container { background: #0a0a1a; }
        .leaflet-control-zoom a { background: rgba(20,20,40,0.9) !important; color: #fff !important; border-color: rgba(255,255,255,0.15) !important; }
        .leaflet-control-zoom { border: none !important; }
        .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: rgba(255,255,255,0.4) !important; }
        .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }

        #header {
            position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 22px; border-radius: 14px; font-size: 17px; font-weight: bold;
            z-index: 1000; backdrop-filter: blur(12px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            text-align: center; pointer-events: none; white-space: nowrap;
        }
        #header small { display: block; font-size: 11px; font-weight: normal; opacity: 0.65; margin-top: 1px; }

        #search-container {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; gap: 6px; width: 92%; max-width: 500px;
        }
        #search-input {
            flex: 1; padding: 10px 16px; border: none; border-radius: 30px; font-size: 14px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(16px);
            color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,0.35);
            transition: all 0.3s; outline: none; font-family: inherit;
        }
        #search-input::placeholder { color: rgba(255,255,255,0.45); }
        #search-input:focus { background: rgba(255,255,255,0.18); box-shadow: 0 4px 25px rgba(0,0,0,0.45); }
        #search-btn {
            padding: 10px 18px; border: none; border-radius: 30px;
            background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff;
            font-size: 14px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(231,76,60,0.35); transition: all 0.25s; font-family: inherit; flex-shrink: 0;
        }
        #search-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(231,76,60,0.55); }

        #results {
            position: fixed; top: 125px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 500px;
            max-height: calc(100vh - 160px); overflow-y: auto; display: none;
            -webkit-overflow-scrolling: touch;
        }
        #results::-webkit-scrollbar { width: 4px; }
        #results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .result-item {
            background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); color: #fff;
            padding: 13px 16px; margin-bottom: 6px; border-radius: 14px;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .result-item:hover { background: rgba(0,0,0,0.85); transform: translateX(4px); border-color: rgba(231,76,60,0.25); }
        .result-item .top { display: flex; justify-content: space-between; align-items: center; }
        .result-item h3 { margin: 0; font-size: 15px; }
        .result-item .cat {
            font-size: 10px; background: rgba(231,76,60,0.6); padding: 2px 9px;
            border-radius: 10px; display: inline-block; flex-shrink: 0;
        }
        .result-item .rgn { font-size: 12px; opacity: 0.55; margin-top: 2px; }

        /* Info popup 스타일 - Leaflet 기본 팝업 커스터마이징 */
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(15,20,35,0.95);
            backdrop-filter: blur(16px);
            color: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(15,20,35,0.95);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .custom-popup .leaflet-popup-close-button {
            color: rgba(255,255,255,0.4) !important;
            font-size: 20px !important;
            top: 8px !important;
            right: 8px !important;
        }
        .popup-content {
            padding: 8px 4px;
            max-width: 280px;
        }
        .popup-content h3 {
            font-size: 17px; margin-bottom: 3px;
        }
        .popup-content .cat-badge {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 11px; font-weight: bold; margin-bottom: 6px;
        }
        .popup-content .desc {
            font-size: 13px; line-height: 1.6; color: #ddd; margin-bottom: 4px;
        }
        .popup-content .tip {
            font-size: 12px; color: #bbb; line-height: 1.5;
            padding: 8px 10px; background: rgba(255,255,255,0.05); border-radius: 10px;
            margin-top: 6px;
        }
        .popup-content .tip b { color: #4f8cf7; }
        .popup-content .coords {
            font-size: 11px; opacity: 0.4; margin-top: 6px;
        }

        @media (max-width: 600px) {
            #header { font-size: 14px; padding: 8px 14px; top: 8px; }
            #search-container { top: 60px; }
            #search-btn { padding: 10px 14px; font-size: 13px; }
            #results { top: 112px; }
            .popup-content { max-width: 220px; }
            .popup-content h3 { font-size: 15px; }
        }
    </style>
</head>
<body>

        <button id="search-btn">🔍 검색</button>
    </div>

            {name:'공주무령왕릉',region:'충남',lat:36.4613,lng:127.1178,category:'역사/유적',desc:'백제 시대 왕릉, 금관과 장신구 등 귀중 유물 출토.',tip:'국립공주박물관에서 유물 전시 중! 공산성도 함께.'},
            {name:'부여백제문화단지',region:'충남',lat:36.2748,lng:126.9127,category:'역사/문화',desc:'백제 역사 문화 재현 대규모 테마파크.',tip:'부소산성과 낙화암도 함께! 백제문화제(9-10월) 최고.'},
            {name:'충주호',region:'충북',lat:36.9712,lng:128.0019,category:'자연/호수',desc:'청풍호반과 유람선이 아름다운 충북의 호수.',tip:'유람선 타고 충주호 둘러보고 충주 탄금대도 방문!'},
            {name:'단양고수동굴',region:'충북',lat:36.9578,lng:128.3630,category:'자연/동굴',desc:'천연동굴의 신비를 체험할 수 있는 충북 대표 명소.',tip:'도담삼봉과 만천하 스카이워크도 함께!'},
        ];

        // ----- Leaflet 지도 초기화 (다크 스타일) -----
        const map = L.map('map', {
            center: [36.0, 127.8],
            zoom: 7,
            minZoom: 6,
            maxZoom: 14,
            zoomControl: false
        });

        // 다크 스타일 타일
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 줌 컨트롤 위치 조정
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ----- 마커 및 팝업 -----
        const catColors = {
            '궁궐/역사':'#e74c3c','랜드마크':'#f39c12','문화/전통':'#2ecc71','쇼핑/거리':'#9b59b6',
            '문화/거리':'#e91e63','쇼핑/업무':'#1abc9c','자연/섬':'#3498db','자연/산':'#27ae60',
            '자연/명소':'#1abc9c','해변/휴양':'#00bcd4','문화/마을':'#ff5722','맛집/시장':'#ff9800',
            '역사/유적':'#8d6e63','사찰/역사':'#ffd54f','전통/마을':'#4caf50','공원/전시':'#2196f3',
            '자연/공원':'#009688','문화/전시':'#673ab7','테마파크':'#ff4081','역사/평화':'#795548',
            '역사/기념관':'#607d8b','역사/문화':'#8bc34a','자연/호수':'#03a9f4','자연/동굴':'#795548',
        };

        const markers = [];

        attractions.forEach(a => {
            const color = catColors[a.category] || '#ffffff';

            // 커스텀 마커 아이콘 (divIcon)
            const icon = L.divIcon({
                html: `<div style="
                    width: 14px; height: 14px;
                    background: ${color};
                    border: 2px solid rgba(255,255,255,0.8);
                    border-radius: 50%;
                    box-shadow: 0 0 12px ${color}40, 0 2px 8px rgba(0,0,0,0.5);
                    transition: all 0.2s;
                "></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                className: ''
            });

            const marker = L.marker([a.lat, a.lng], { icon }).addTo(map);

            // 팝업 내용
            const popupContent = `
                <div class="popup-content">
                    <h3>${a.name}</h3>
                    <span class="cat-badge" style="background:${color}">${a.category}</span>
                    <div style="font-size:12px;opacity:0.6;margin-bottom:6px;">\ud83d\udccd ${a.region}</div>
                    <div class="desc">${a.desc}</div>
                    <div class="tip"><b>\ud83d\udca1 여행 팁:</b> ${a.tip}</div>
                    <div class="coords">\ud83d\udcc8 ${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}</div>
                </div>
            `;

            marker.bindPopup(popupContent, {
                className: 'custom-popup',
                maxWidth: 320,
                closeButton: true
            });

            // 마커 hover 효과
            marker.on('mouseover', function() {
                this.openPopup();
            });

            markers.push({ marker, data: a });
        });

        // ----- 검색 기능 -----
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsDiv = document.getElementById('results');

        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) { resultsDiv.style.display = 'none'; return; }
            const filtered = attractions.filter(a =>
                a.name.toLowerCase().includes(q) || a.region.toLowerCase().includes(q) ||
                a.category.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
            );
            resultsDiv.innerHTML = '';
            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="result-item" style="text-align:center;opacity:0.6;">\ud83d\ude05 검색 결과가 없습니다.</div>';
                resultsDiv.style.display = 'block'; return;
            }
            filtered.forEach(a => {
                const item = document.createElement('div');
                item.className = 'result-item';
                const color = catColors[a.category] || '#ffffff';
                item.innerHTML = '<div class="top"><h3>' + a.name + '</h3><span class="cat" style="background:' + color + '">' + a.category + '</span></div><div class="rgn">\ud83d\udccd ' + a.region + '</div>';
                item.addEventListener('click', () => {
                    map.setView([a.lat, a.lng], 12, { animate: true });
                    resultsDiv.style.display = 'none';
                    searchInput.value = a.name;
                    // 해당 마커 찾아서 팝업 열기
                    const found = markers.find(m => m.data.name === a.name);
                    if (found) found.marker.openPopup();
                });
                resultsDiv.appendChild(item);
            });
            resultsDiv.style.display = 'block';
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        let dt;
        searchInput.addEventListener('input', () => { clearTimeout(dt); dt = setTimeout(doSearch, 300); });

        document.addEventListener('click', e => {
            if (!resultsDiv.contains(e.target) && e.target !== searchInput && e.target !== searchBtn) {
                resultsDiv.style.display = 'none';
            }
        });

        console.log('\u2705 대한민국 관광명소 지도 로딩 완료! (총 ' + attractions.length + '개 명소)');
    </script>
</body>
</html>
