<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 관광명소 - 3D 지도</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
        #info { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: white; padding: 12px 24px; border-radius: 14px; font-size: 20px; font-weight: bold; z-index: 100; backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; letter-spacing: 1px; pointer-events: none; white-space: nowrap; }
        #info small { display: block; font-size: 12px; font-weight: normal; opacity: 0.7; margin-top: 2px; }
        #search-container { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 6px; width: 92%; max-width: 500px; }
        #search-input { flex: 1; padding: 12px 18px; border: none; border-radius: 30px; font-size: 15px; background: rgba(255,255,255,0.12); backdrop-filter: blur(14px); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s; outline: none; font-family: inherit; }
        #search-input::placeholder { color: rgba(255,255,255,0.5); }
        #search-input:focus { background: rgba(255,255,255,0.2); box-shadow: 0 4px 25px rgba(0,0,0,0.4); }
        #search-btn { padding: 12px 22px; border: none; border-radius: 30px; background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff; font-size: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(231,76,60,0.4); transition: all 0.3s; font-family: inherit; flex-shrink: 0; }
        #search-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(231,76,60,0.6); }
        #results { position: absolute; top: 140px; left: 50%; transform: translateX(-50%); z-index: 100; width: 92%; max-width: 500px; max-height: calc(100vh - 180px); overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
        #results::-webkit-scrollbar { width: 4px; }
        #results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 2px; }
        .result-item { background: rgba(0,0,0,0.65); backdrop-filter: blur(14px); color: #fff; padding: 14px 18px; margin-bottom: 6px; border-radius: 12px; cursor: pointer; transition: all 0.25s; border: 1px solid rgba(255,255,255,0.08); }
        .result-item:hover { background: rgba(0,0,0,0.8); transform: translateX(4px); border-color: rgba(231,76,60,0.3); }
        .result-item h3 { margin: 0 0 3px; font-size: 16px; }
        .result-item .category { font-size: 11px; background: rgba(231,76,60,0.65); padding: 2px 10px; border-radius: 10px; display: inline-block; margin-bottom: 3px; }
        .result-item .region { font-size: 12px; opacity: 0.65; }
        .result-item .desc { font-size: 13px; opacity: 0.85; margin-top: 4px; line-height: 1.4; }
        #loading { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 13px; z-index: 100; background: rgba(0,0,0,0.5); padding: 8px 18px; border-radius: 20px; backdrop-filter: blur(4px); transition: opacity 0.5s; }
        #controls-hint { position: absolute; bottom: 20px; right: 16px; color: rgba(255,255,255,0.3); font-size: 11px; z-index: 100; text-align: right; line-height: 1.5; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px); pointer-events: none; }
        @media (max-width: 600px) {
            #info { font-size: 16px; padding: 10px 18px; top: 10px; }
            #search-container { top: 70px; flex-direction: column; }
            #search-btn { padding: 12px; font-size: 14px; }
            #controls-hint { display: none; }
            #results { top: 130px; }
        }
    </style>
</head>
<body>
    <div id="info">&#x1F1F0;&#x1F1F7; 대한민국 관광명소 <small>3D 인터랙티브 지도</small></div>
    <div id="search-container">
        <input type="text" id="search-input" autocomplete="off" placeholder="관광명소를 검색하세요 (예: 경복궁, 제주도, 부산...)">
        <button id="search-btn">&#x1F50D; 검색</button>
    </div>
    <div id="results"></div>
    <div id="loading">&#x1F30F; 3D 지도를 불러오는 중...</div>
    <div id="controls-hint">&#x1F5B1; 드래그: 회전<br>&#x1F504; 스크롤: 확대/축소</div>    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const attractions = [
            {name:'경복궁',region:'서울',lat:37.5796,lng:126.9770,category:'궁궐/역사',desc:'조선 왕조의 법궁, 서울 대표 역사 유적지'},
            {name:'남산서울타워',region:'서울',lat:37.5512,lng:126.9882,category:'랜드마크',desc:'서울의 상징 타워, 아름다운 야경 명소'},
            {name:'북촌한옥마을',region:'서울',lat:37.5826,lng:126.9850,category:'문화/전통',desc:'전통 한옥이 보존된 서울 도심 역사 마을'},
            {name:'명동',region:'서울',lat:37.5609,lng:126.9853,category:'쇼핑/거리',desc:'서울 최대 쇼핑과 먹거리 천국'},
            {name:'인사동',region:'서울',lat:37.5736,lng:126.9855,category:'문화/전통',desc:'전통 문화와 현대 예술이 공존하는 거리'},
            {name:'홍대',region:'서울',lat:37.5563,lng:126.9236,category:'문화/거리',desc:'젊음의 거리, 클럽과 카페, 길거리 공연 메카'},
            {name:'강남',region:'서울',lat:37.4981,lng:127.0276,category:'쇼핑/업무',desc:'한국 경제 중심지, 고급 쇼핑과 맛집 거리'},
            {name:'여의도',region:'서울',lat:37.5219,lng:126.9244,category:'랜드마크',desc:'63빌딩과 한강이 어우러진 업무 중심지'},
            {name:'제주도',region:'제주',lat:33.3803,lng:126.5350,category:'자연/섬',desc:'한국 최대 섬, 아름다운 자연과 올레길 천국'},
            {name:'한라산',region:'제주',lat:33.3625,lng:126.5334,category:'자연/산',desc:'제주의 상징 해발 1,950m 웅장한 사화산'},
            {name:'성산일출봉',region:'제주',lat:33.4581,lng:126.9425,category:'자연/명소',desc:'UNESCO 자연유산, 일출 장관 분화구'},
            {name:'해운대',region:'부산',lat:35.1587,lng:129.1603,category:'해변/휴양',desc:'부산 대표 해수욕장, 모래사장과 맛집 유명'},
            {name:'감천문화마을',region:'부산',lat:35.0978,lng:129.0107,category:'문화/마을',desc:'알록달록 벽화마을, 사진 명소'},
            {name:'광안리해수욕장',region:'부산',lat:35.1538,lng:129.1183,category:'해변/휴양',desc:'광안대교 야경 아름다운 부산 해변'},
            {name:'자갈치시장',region:'부산',lat:35.0978,lng:129.0292,category:'맛집/시장',desc:'한국 최대 수산시장, 활어회 본고장'},
            {name:'경주역사지구',region:'경주',lat:35.7890,lng:129.2240,category:'역사/유적',desc:'신라 천년 고도, UNESCO 세계문화유산'},
            {name:'불국사',region:'경주',lat:35.7902,lng:129.3321,category:'사찰/역사',desc:'신라 대표 사찰, UNESCO 세계문화유산'},
            {name:'석굴암',region:'경주',lat:35.7951,lng:129.3492,category:'사찰/역사',desc:'통일신라 불교 조각 예술의 정수'},
            {name:'안동하회마을',region:'경북',lat:36.5392,lng:128.5172,category:'전통/마을',desc:'조선 양반 마을 원형 보존, UNESCO 문화유산'},
            {name:'전주한옥마을',region:'전북',lat:35.8138,lng:127.1485,category:'전통/마을',desc:'한옥과 비빔밥 본고장, 전통 문화 체험'},
            {name:'대구동성로',region:'대구',lat:35.8692,lng:128.5952,category:'쇼핑/거리',desc:'대구의 명동, 패션과 먹거리 중심지'},
            {name:'대전엑스포공원',region:'대전',lat:36.3767,lng:127.3844,category:'공원/전시',desc:'1993 대전엑스포 개최지, 한빛탑 상징'},
            {name:'울산대왕암공원',region:'울산',lat:35.5022,lng:129.4292,category:'자연/공원',desc:'동해안 절경, 기암괴석 해안공원'},
            {name:'인천차이나타운',region:'인천',lat:37.4778,lng:126.6190,category:'문화/거리',desc:'한국 최초 차이나타운, 짜장면 발상지'},
            {name:'광주국립아시아문화전당',region:'광주',lat:35.1467,lng:126.9184,category:'문화/전시',desc:'아시아 문화 교류 중심, 현대 건축물'},
            {name:'설악산국립공원',region:'강원',lat:38.1195,lng:128.4642,category:'자연/산',desc:'한국의 알프스, 웅장한 암봉과 단풍'},
            {name:'남해군',region:'경남',lat:34.8140,lng:127.9289,category:'자연/섬',desc:'다도해 아름다운 풍경, 독일마을과 청정 바다'},
            {name:'통영케이블카',region:'경남',lat:34.8315,lng:128.4227,category:'자연/명소',desc:'한려해상국립공원을 한눈에 케이블카'},
            {name:'순천만국가정원',region:'전남',lat:34.9258,lng:127.4947,category:'자연/공원',desc:'세계적 생태 관광지, 갈대밭과 S자 수로'},
            {name:'제부도',region:'경기',lat:37.1945,lng:126.6313,category:'자연/섬',desc:'하루 두 번 바닷길 열리는 신비한 섬'},
            {name:'용인에버랜드',region:'경기',lat:37.2935,lng:127.2070,category:'테마파크',desc:'한국 최대 테마파크, 사계절 즐길 거리'},
            {name:'포항죽도시장',region:'경북',lat:36.0180,lng:129.3657,category:'맛집/시장',desc:'과메기와 물회 본고장, 포항 전통시장'},
            {name:'속초관광수산시장',region:'강원',lat:38.2072,lng:128.5921,category:'맛집/시장',desc:'강원도 대표 시장, 오징어순대와 닭강정'},
            {name:'철원 DMZ',region:'강원',lat:38.2220,lng:127.2140,category:'역사/평화',desc:'한반도 분단 현장, 평화와 생태 상징'},
            {name:'천안독립기념관',region:'충남',lat:36.7803,lng:127.2217,category:'역사/기념관',desc:'한국 독립운동 역사 기리는 대표 기념관'},
            {name:'공주무령왕릉',region:'충남',lat:36.4613,lng:127.1178,category:'역사/유적',desc:'백제 시대 왕릉, 금관과 장신구 유물 출토'},
            {name:'부여백제문화단지',region:'충남',lat:36.2748,lng:126.9127,category:'역사/문화',desc:'백제 역사 문화 재현 대규모 테마파크'},
            {name:'충주호',region:'충북',lat:36.9712,lng:128.0019,category:'자연/호수',desc:'청풍호반과 유람선 아름다운 충북 호수'},
            {name:'단양고수동굴',region:'충북',lat:36.9578,lng:128.3630,category:'자연/동굴',desc:'천연동굴 신비 체험, 충북 대표 명소'},
        ];        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 8, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 35;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.target.set(0, 0, 0);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
        rimLight.position.set(0, -5, -15);
        scene.add(rimLight);

        // --- Korean Peninsula (FIXED rotation) ---
        const peninsulaPoints = [
            [124.6,38.6],[124.6,38.3],[124.3,37.9],[124.3,37.5],[124.7,37.0],[124.8,36.6],
            [125.1,36.2],[125.4,35.9],[125.8,35.6],[126.3,35.3],[126.8,35.0],[127.0,34.9],
            [127.3,34.5],[127.8,34.3],[128.2,34.3],[128.6,34.5],[129.0,34.6],[129.2,34.7],
            [129.3,35.1],[129.5,35.3],[129.5,35.6],[129.3,35.8],[129.2,36.0],[129.1,36.2],
            [129.3,36.5],[129.4,36.8],[129.3,37.2],[129.2,37.5],[129.1,37.7],[129.1,38.0],
            [129.2,38.3],[129.3,38.5],[129.2,38.7],[129.0,38.8],[128.7,38.9],[128.5,38.7],
            [128.5,38.3],[128.5,38.1],[128.2,37.9],[127.9,37.9],[127.6,38.0],[127.4,38.2],
            [127.2,38.3],[126.5,38.5],[126.0,38.6],[125.4,38.7],[125.0,38.7],[124.9,38.6],
        ];
        const centerLat = 36.0;
        const centerLng = 127.8;
        const SCALE = 0.13;

        function createShape(pts, color, emissiveColor) {
            const shape = new THREE.Shape();
            pts.forEach((p, i) => {
                const x = (p[0] - centerLng) * SCALE;
                const y = -(p[1] - centerLat) * SCALE;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            });
            const geom = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshPhongMaterial({
                color: color, emissive: emissiveColor || 0x000000,
                emissiveIntensity: 0.3, shininess: 20, side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.y = -0.1;
            mesh.receiveShadow = true;
            return mesh;
        }

        // Peninsula main
        scene.add(createShape(peninsulaPoints, 0x2d5a3d, 0x0a2a12));

        // Peninsula outline
        const outlinePts = peninsulaPoints.map(p => {
            return new THREE.Vector3((p[0]-centerLng)*SCALE, -0.08, -(p[1]-centerLat)*SCALE);
        });
        const outlineGeom = new THREE.BufferGeometry().setFromPoints(outlinePts);
        const outlineLine = new THREE.Line(outlineGeom, new THREE.LineBasicMaterial({ color: 0x4a8a5a, transparent: true, opacity: 0.4 }));
        scene.add(outlineLine);

        // Jeju Island
        const jejuPts = [[126.2,33.2],[126.8,33.2],[127.0,33.5],[126.8,33.6],[126.4,33.6],[126.1,33.5]];
        scene.add(createShape(jejuPts, 0x3a7a4a, 0x0a2a12));

        // Ulleungdo & Dokdo
        [[130.9,37.5],[131.87,37.24]].forEach((pos, i) => {
            const x = (pos[0] - centerLng) * SCALE;
            const z = -(pos[1] - centerLat) * SCALE;
            const g = new THREE.CircleGeometry(i === 0 ? 0.04 : 0.02, 16);
            const m = new THREE.MeshBasicMaterial({ color: 0x4a8a5a, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(g, m);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.set(x, -0.1, z);
            scene.add(mesh);
        });

        // Ocean
        const oceanGeom = new THREE.PlaneGeometry(18, 18, 60, 60);
        const oceanMat = new THREE.MeshPhongMaterial({
            color: 0x0a2a4a, emissive: 0x041828, emissiveIntensity: 0.5,
            shininess: 10, transparent: true, opacity: 0.5, side: THREE.DoubleSide
        });
        const ocean = new THREE.Mesh(oceanGeom, oceanMat);
        ocean.rotation.x = Math.PI / 2;
        ocean.position.y = -0.5;
        ocean.receiveShadow = true;
        scene.add(ocean);

        // Ocean wave animation
        const posAttr = oceanGeom.attributes.position;
        setInterval(() => {
            const now = Date.now() * 0.001;
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                posAttr.setZ(i, 0.05 * Math.sin(x * 2 + now) * Math.cos(y * 2 + now * 0.7));
            }
            posAttr.needsUpdate = true;
        }, 50);

        // Stars
        const starVerts = [];
        for (let i = 0; i < 2000; i++) {
            starVerts.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
        }
        const starGeom = new THREE.BufferGeometry();
        starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
        const stars = new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 }));
        scene.add(stars);        // --- Markers & Labels (CSS2D) ---
        const markerGroup = new THREE.Group();
        const colorMap = {
            '궁궐/역사':0xe74c3c,'랜드마크':0xf39c12,'문화/전통':0x2ecc71,'쇼핑/거리':0x9b59b6,
            '문화/거리':0xe91e63,'쇼핑/업무':0x1abc9c,'자연/섬':0x3498db,'자연/산':0x27ae60,
            '자연/명소':0x1abc9c,'해변/휴양':0x00bcd4,'문화/마을':0xff5722,'맛집/시장':0xff9800,
            '역사/유적':0x8d6e63,'사찰/역사':0xffd54f,'전통/마을':0x4caf50,'공원/전시':0x2196f3,
            '자연/공원':0x009688,'문화/전시':0x673ab7,'테마파크':0xff4081,'역사/평화':0x795548,
            '역사/기념관':0x607d8b,'역사/문화':0x8bc34a,'자연/호수':0x03a9f4,'자연/동굴':0x795548,
        };

        attractions.forEach(a => {
            const x = (a.lng - centerLng) * SCALE;
            const z = -(a.lat - centerLat) * SCALE;
            const c = colorMap[a.category] || 0xffffff;

            const g = new THREE.Group();
            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.35,8), new THREE.MeshPhysicalMaterial({color:c,emissive:c,emissiveIntensity:0.3,roughness:0.3,metalness:0.2}));
            cone.position.y=0.15; cone.castShadow=true; g.add(cone);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), new THREE.MeshPhysicalMaterial({color:c,emissive:c,emissiveIntensity:0.5,roughness:0.2,metalness:0.3}));
            head.position.y=0.35; g.add(head);
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.08,0.2,16), new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
            ring.rotation.x=-Math.PI/2; ring.position.y=0.01; g.add(ring);
            g.position.set(x,0.05,z);
            markerGroup.add(g);

            const div = document.createElement('div');
            div.textContent = a.name;
            div.style.cssText = 'color:white;font-size:12px;font-weight:bold;text-shadow:0 2px 8px rgba(0,0,0,0.8),0 0 4px rgba(0,0,0,0.5);background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);backdrop-filter:blur(4px);white-space:nowrap;pointer-events:none;';
            const label = new CSS2DObject(div);
            label.position.set(x,0.65,z);
            markerGroup.add(label);
        });
        scene.add(markerGroup);

        // --- Grid Lines ---
        const gridG = new THREE.Group();
        const lineMat = new THREE.LineBasicMaterial({color:0x2a5a8a,transparent:true,opacity:0.1});
        for (let i=-6;i<=6;i++) {
            const p1=[],p2=[];
            for (let j=-6;j<=6;j++) {
                p1.push(new THREE.Vector3(i*1.2,0,j*1.2));
                p2.push(new THREE.Vector3(j*1.2,0,i*1.2));
            }
            gridG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p1),lineMat));
            gridG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p2),lineMat));
        }
        scene.add(gridG);

        // --- Search ---
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');

        setTimeout(() => { loadingDiv.style.opacity = '0'; setTimeout(()=>{loadingDiv.style.display='none'},500); }, 2000);

        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) { resultsDiv.style.display = 'none'; return; }
            const filtered = attractions.filter(a =>
                a.name.toLowerCase().includes(q) || a.region.toLowerCase().includes(q) ||
                a.category.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
            );
            resultsDiv.innerHTML = '';
            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="result-item" style="text-align:center;opacity:0.6;">검색 결과가 없습니다.</div>';
                resultsDiv.style.display = 'block'; return;
            }
            filtered.forEach(a => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = '<span class="category">'+a.category+'</span><h3>'+a.name+'</h3><div class="region">'+a.region+'</div><div class="desc">'+a.desc+'</div>';
                item.addEventListener('click', () => {
                    const x = (a.lng - centerLng) * SCALE;
                    const z = -(a.lat - centerLat) * SCALE;
                    controls.target.set(x, 0, z);
                    const ang = Math.atan2(x, z);
                    camera.position.set(x + 7*Math.sin(ang), 5, z + 7*Math.cos(ang));
                    controls.update();
                    resultsDiv.style.display = 'none';
                    searchInput.value = a.name;
                });
                resultsDiv.appendChild(item);
            });
            resultsDiv.style.display = 'block';
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        let dt;
        searchInput.addEventListener('input', () => { clearTimeout(dt); dt = setTimeout(doSearch, 300); });

        document.addEventListener('click', e => {
            if (!resultsDiv.contains(e.target) && e.target !== searchInput && e.target !== searchBtn) {
                resultsDiv.style.display = 'none';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        console.log('✅ 대한민국 관광명소 3D 지도 로딩 완료! (총 ' + attractions.length + '개 명소)');
    </script>
</body>
</html>
