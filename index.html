<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 관광명소 - 3D 지도</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', 'Noto Sans KR', -apple-system, sans-serif; background: #0a0a2a; color: #fff; }

        #info {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 22px; border-radius: 14px; font-size: 18px; font-weight: bold;
            z-index: 100; backdrop-filter: blur(12px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            text-align: center; letter-spacing: 1px; pointer-events: none; white-space: nowrap;
        }
        #info small { display: block; font-size: 11px; font-weight: normal; opacity: 0.65; margin-top: 1px; }

        #search-container {
            position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; width: 92%; max-width: 520px;
        }
        #search-input {
            flex: 1; padding: 11px 18px; border: none; border-radius: 30px; font-size: 14px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(16px);
            color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,0.35);
            transition: all 0.3s; outline: none; font-family: inherit;
        }
        #search-input::placeholder { color: rgba(255,255,255,0.45); }
        #search-input:focus { background: rgba(255,255,255,0.2); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        #search-btn {
            padding: 11px 20px; border: none; border-radius: 30px;
            background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff;
            font-size: 14px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(231,76,60,0.35); transition: all 0.25s; font-family: inherit; flex-shrink: 0;
        }
        #search-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(231,76,60,0.55); }
        #search-btn:active { transform: scale(0.96); }

        #results {
            position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 92%; max-width: 520px;
            max-height: calc(100vh - 170px); overflow-y: auto; display: none;
            -webkit-overflow-scrolling: touch;
        }
        #results::-webkit-scrollbar { width: 5px; }
        #results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .result-item {
            background: rgba(0,0,0,0.7); backdrop-filter: blur(16px); color: #fff;
            padding: 14px 18px; margin-bottom: 7px; border-radius: 14px;
            cursor: pointer; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.06);
            -webkit-tap-highlight-color: transparent;
        }
        .result-item:hover { background: rgba(0,0,0,0.85); transform: translateX(5px); border-color: rgba(231,76,60,0.25); }
        .result-item .top-row { display: flex; justify-content: space-between; align-items: center; }
        .result-item h3 { margin: 0; font-size: 16px; }
        .result-item .category {
            font-size: 10px; background: rgba(231,76,60,0.6); padding: 2px 10px;
            border-radius: 10px; display: inline-block; flex-shrink: 0;
        }
        .result-item .region { font-size: 12px; opacity: 0.55; margin-top: 3px; }
        .result-item .desc { font-size: 13px; opacity: 0.8; margin-top: 5px; line-height: 1.45; }

        #detail-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            z-index: 200; display: none;
        }
        #detail-panel .backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        #detail-panel .content {
            position: relative; z-index: 1;
            background: rgba(10,14,26,0.92); backdrop-filter: blur(24px);
            border-radius: 20px 20px 0 0;
            padding: 24px 24px 32px;
            border-top: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
            max-height: 75vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #detail-panel .close-btn {
            position: absolute; top: 12px; right: 18px;
            background: none; border: none; color: rgba(255,255,255,0.4);
            font-size: 26px; cursor: pointer; transition: color 0.2s;
        }
        #detail-panel .close-btn:hover { color: #fff; }
        #detail-panel h2 { font-size: 22px; margin-bottom: 4px; }
        #detail-panel .cat-badge {
            display: inline-block; padding: 3px 12px; border-radius: 12px;
            font-size: 12px; font-weight: bold; margin: 4px 0 8px;
        }
        #detail-panel .region-line { font-size: 14px; opacity: 0.6; margin-bottom: 10px; }
        #detail-panel .desc-text { font-size: 15px; line-height: 1.7; color: #ddd; margin-bottom: 8px; }
        #detail-panel .coords { font-size: 12px; opacity: 0.4; margin-top: 10px; }
        #detail-panel .goto-btn {
            display: inline-block; margin-top: 12px;
            padding: 10px 24px; border: none; border-radius: 30px;
            background: linear-gradient(135deg,#4f8cf7,#3a6fd8); color: #fff;
            font-size: 14px; cursor: pointer; font-weight: bold;
            transition: all 0.25s;
        }
        #detail-panel .goto-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,140,247,0.4); }

        #loading {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.45); font-size: 13px; z-index: 100;
            background: rgba(0,0,0,0.5); padding: 8px 18px; border-radius: 20px;
            backdrop-filter: blur(4px); transition: opacity 0.5s;
        }
        #controls-hint {
            position: absolute; bottom: 20px; right: 16px;
            color: rgba(255,255,255,0.25); font-size: 10px; z-index: 100;
            text-align: right; line-height: 1.5;
            background: rgba(0,0,0,0.25); padding: 7px 11px; border-radius: 8px;
            backdrop-filter: blur(4px); pointer-events: none;
        }
        @media (max-width: 600px) {
            #info { font-size: 15px; padding: 8px 16px; top: 8px; }
            #search-container { top: 62px; }
            #search-btn { padding: 11px 15px; font-size: 13px; }
            #controls-hint { display: none; }
            #results { top: 118px; }
            #detail-panel .content { padding: 18px 16px 24px; }
            #detail-panel h2 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="info">🇰🇷 대한민국 관광명소 <small>3D 인터랙티브 지도</small></div>
    <div id="search-container">
        <input type="text" id="search-input" autocomplete="off" placeholder="명소 이름 또는 지역을 입력하세요 (예: 경복궁, 제주도, 부산...)">
        <button id="search-btn">🔍 검색</button>
    </div>
    <div id="results"></div>
    <div id="detail-panel">
        <div class="backdrop" id="panel-backdrop"></div>
        <div class="content">
            <button class="close-btn" id="panel-close">&#x2716;</button>
            <h2 id="detail-name"></h2>
            <span class="cat-badge" id="detail-cat"></span>
            <div class="region-line" id="detail-region"></div>
            <div class="desc-text" id="detail-desc"></div>
            <div id="detail-tips" style="margin-top:8px;padding:10px 14px;background:rgba(255,255,255,0.05);border-radius:12px;font-size:14px;line-height:1.6;color:#ccc;"></div>
            <div class="coords" id="detail-coords"></div>
            <button class="goto-btn" id="detail-goto">📍 지도에서 보기</button>
        </div>
    </div>
    <div id="loading">🌏 3D 지도를 불러오는 중...</div>
    <div id="controls-hint">🖱 드래그: 회전 &nbsp;|&nbsp; 🔄 스크롤: 확대/축소<br>📍 마커 클릭: 상세 정보</div>    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ----- 관광명소 데이터 (40개) -----
        const attractions = [
            {name:'경복궁',region:'서울',lat:37.5796,lng:126.9770,category:'궁궐/역사',desc:'조선 왕조의 법궁으로, 1395년에 창건된 서울의 대표적인 역사 유적지입니다. 근정전, 경회루 등 웅장한 건축물이 인상적이며, 한복 대여 체험과 수문장 교대식이 유명합니다.',tip:'한복을 입고 방문하면 무료 입장! 인근에 국립민속박물관도 함께 방문해보세요.'},
            {name:'남산서울타워',region:'서울',lat:37.5512,lng:126.9882,category:'랜드마크',desc:'서울의 상징 N서울타워. 해발 236m, 타워 높이 236m로 서울 시내를 한눈에 내려다볼 수 있습니다. 야경이 특히 아름다우며, 자물쇠를 걸어두는 사랑의 테마 명소입니다.',tip:'케이블카를 타고 올라가거나, 남산둘레길 도보 코스도 추천! 일몰 시간에 맞춰 방문하세요.'},
            {name:'북촌한옥마을',region:'서울',lat:37.5826,lng:126.9850,category:'문화/전통',desc:'서울 도심에 위치한 전통 한옥 밀집 지역. 조선 시대부터 이어진 북촌의 골목골목에서 전통과 현대가 공존하는 독특한 분위기를 느낄 수 있습니다.',tip:'조용한 주거지역이니 방문 시 주의! 북촌 8경 코스를 따라 걸어보세요.'},
            {name:'명동',region:'서울',lat:37.5609,lng:126.9853,category:'쇼핑/거리',desc:'서울을 대표하는 쇼핑과 먹거리의 천국. 대형 쇼핑몰부터 길거리 음식까지 모든 것이 있고, 명동성당도 방문할 수 있습니다.',tip:'저녁 시간이 더 활기참! 길거리 음식 중 떡볶이와 통닭꼬치가 인기 만점.'},
            {name:'인사동',region:'서울',lat:37.5736,lng:126.9855,category:'문화/전통',desc:'전통 문화와 현대 예술이 공존하는 서울의 문화 중심지. 전통 찻집, 화랑, 공예품 가게가 즐비해 있습니다.',tip:'쌈지길(쇼핑몰)은 인사동의 핵심 명소! 주말에는 문화의 거리 공연도 열립니다.'},
            {name:'홍대',region:'서울',lat:37.5563,lng:126.9236,category:'문화/거리',desc:'젊음의 거리, 클럽과 카페, 길거리 공연의 메카. 독특한 감성의 카페와 음악, 예술이 살아 숨쉬는 곳입니다.',tip:'주말 홍대 앞 걷고 싶은 거리에서 버스킹 공연을 꼭 보세요! 다양한 카페 탐방도 즐거움.'},
            {name:'강남',region:'서울',lat:37.4981,lng:127.0276,category:'쇼핑/업무',desc:'한국의 경제 중심지이자 K-pop 스타의 본고장. 고급 쇼핑몰, 맛집, 그리고 코엑스(COEX)가 위치한 서울의 핫 플레이스.',tip:'코엑스 별마당 도서관은 인생샷 명소! 저녁에는 강남역 인근에서 다양한 먹거리.'},
            {name:'여의도',region:'서울',lat:37.5219,lng:126.9244,category:'랜드마크',desc:'63빌딩과 한강이 어우러진 서울의 업무 중심지. 봄에는 벚꽃 명소로 유명하며, 한강공원에서 여유를 즐길 수 있습니다.',tip:'4월 벚꽃 시즌 윤중로는 꼭 방문! 63빌딩 전망대에서 바라보는 한강 야경이 압권.'},
            {name:'제주도',region:'제주',lat:33.3803,lng:126.5350,category:'자연/섬',desc:'한국 최대의 섬이자 세계적인 휴양지. 아름다운 자연, 올레길, 독특한 화산 지형이 매력적인 곳입니다.',tip:'렌터카 여행이 필수! 우도와 마라도 섬투어도 추천. 한라산 등반은 4-5시간 소요.'},
            {name:'한라산',region:'제주',lat:33.3625,lng:126.5334,category:'자연/산',desc:'제주의 상징, 해발 1,950m의 웅장한 사화산. UNESCO 세계자연유산으로 다양한 식물과 아름다운 풍경을 감상할 수 있습니다.',tip:'성판악 코스가 가장 인기 있음! 정상 백록담은 날씨가 좋을 때만 볼 수 있어요.'},
            {name:'성산일출봉',region:'제주',lat:33.4581,lng:126.9425,category:'자연/명소',desc:'UNESCO 세계자연유산, 해 뜨는 모습이 장관인 거대한 분화구. 정상에 오르면 시원한 바다와 분화구를 한눈에 볼 수 있습니다.',tip:'해돋이 명소로 유명! 입구에서 우동과 성게비빔밥도 맛보세요.'},
            {name:'해운대',region:'부산',lat:35.1587,lng:129.1603,category:'해변/휴양',desc:'부산의 대표 해수욕장. 길이 1.5km의 아름다운 백사장과 주변 고층 건물들이 어우러진 현대적인 해변 도시입니다.',tip:'겨울에는 해운대 빛 축제! 동백섬 산책로도 함께 둘러보세요.'},
            {name:'감천문화마을',region:'부산',lat:35.0978,lng:129.0107,category:'문화/마을',desc:'알록달록한 벽화와 예술 작품으로 가득한 부산의 대표적인 문화 마을. 골목골목 사진 찍기 좋은 명소가 숨겨져 있습니다.',tip:'마을 지도(2,000원)를 사서 스탬프 투어를 하면 더 재미있어요!'
},
            {name:'광안리해수욕장',region:'부산',lat:35.1538,lng:129.1183,category:'해변/휴양',desc:'광안대교의 화려한 야경이 아름다운 부산의 또 다른 해변. 해운대보다 조용하고 여유로운 분위기입니다.',tip:'야경이 예술! 광안리 카페거리에서 커피 한 잔과 함께 광안대교 야경을 즐겨보세요.'},
            {name:'자갈치시장',region:'부산',lat:35.0978,lng:129.0292,category:'맛집/시장',desc:'한국 최대의 수산시장이자 활어회의 본고장. 신선한 해산물을 현장에서 맛볼 수 있는 부산의 대표 먹거리 명소.',tip:'2층에서 회를 사서 1층 식당에 가져가면 횟감 + 자리값만 내고 먹을 수 있어요!'},
            {name:'경주역사지구',region:'경주',lat:35.7890,lng:129.2240,category:'역사/유적',desc:'신라 천년의 고도 경주. 대릉원, 안압지, 첨성대 등 수많은 역사 유적이 시내 곳곳에 산재해 있습니다.',tip:'경주 시내는 자전거 투어가 최고! 황리단길에서 한옥 카페도 방문해보세요.'},
            {name:'불국사',region:'경주',lat:35.7902,lng:129.3321,category:'사찰/역사',desc:'신라 시대의 대표적인 사찰, UNESCO 세계문화유산. 석가탑과 다보탑이 유명하며 웅장한 석조 건축물이 인상적입니다.',tip:'석굴암과 함께 관람 추천! 아침 일찍 가면 한적하게 즐길 수 있어요.'},
            {name:'석굴암',region:'경주',lat:35.7951,lng:129.3492,category:'사찰/역사',desc:'통일신라 불교 조각 예술의 정수. 화강암으로 만든 인공 석굴에 본존불이 안치된 UNESCO 세계문화유산입니다.',tip:'사진 촬영이 제한되니 눈에 담아오세요. 불국사와 함께 관람하는 것이 일반적.'},
            {name:'안동하회마을',region:'경북',lat:36.5392,lng:128.5172,category:'전통/마을',desc:'조선 시대 양반 마을의 원형이 완벽하게 보존된 UNESCO 세계문화유산. 하회별신굿탈놀이가 유명합니다.',tip:'마을 앞 낙동강에서 배를 타고 마을 전체를 조망해보세요! 탈박물관도 필수 코스.'},
            {name:'전주한옥마을',region:'전북',lat:35.8138,lng:127.1485,category:'전통/마을',desc:'한옥과 한식의 본고장. 전주비빔밥과 콩나물국밥이 유명하며, 한옥 숙박 체험을 할 수 있는 곳입니다.',tip:'한복 대여해서 한옥마을 거니는 게 인기! 전동성당과 경기전도 함께 둘러보세요.'},
            {name:'대구동성로',region:'대구',lat:35.8692,lng:128.5952,category:'쇼핑/거리',desc:'대구의 중심 번화가. 패션, 먹거리, 문화가 어우러진 대구의 명동이라 불리는 곳입니다.',tip:'근처 서문시장에서 저녁에 야시장 구경! 대구의 대표 야식은 치맥과 납작만두.'},

            const hex = (clr[a.category]||0xffffff).toString(16).padStart(6,'0');
            panelCat.style.background = '#' + hex;
            panelRegion.textContent = '\uD83D\uDCCD ' + a.region;
            panelDesc.textContent = a.desc;
            panelTips.innerHTML = a.tip ? '\uD83D\uDCA1 <b>여행 팁:</b> ' + a.tip : '';
            panelCoords.textContent = '좌표: 위도 ' + a.lat.toFixed(4) + ', 경도 ' + a.lng.toFixed(4);
            detailPanel.dataset.lat = a.lat;
            detailPanel.dataset.lng = a.lng;
            detailPanel.style.display = 'block';
        }

        function hideDetail() { detailPanel.style.display = 'none'; }

        document.getElementById('panel-close').addEventListener('click', hideDetail);
        document.getElementById('panel-backdrop').addEventListener('click', hideDetail);
        document.getElementById('detail-goto').addEventListener('click', () => {
            const lat = parseFloat(detailPanel.dataset.lat);
            const lng = parseFloat(detailPanel.dataset.lng);
            if (!isNaN(lat) && !isNaN(lng)) {
                const x = (lng-centerLng)*SC, z = -(lat-centerLat)*SC;
                controls.target.set(x, 0, z);
                const ang = Math.atan2(x, z);
                camera.position.set(x + 7*Math.sin(ang), 5, z + 7*Math.cos(ang));
                controls.update();
                hideDetail();
            }
        });

        // Marker click (raycaster)
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        renderer.domElement.addEventListener('click', (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const meshes = [];
            markerGroup.children.forEach(m => { m.children.forEach(c => { if(c.isMesh) meshes.push(c); }); });
            const hits = raycaster.intersectObjects(meshes);
            if (hits.length > 0) {
                let hitObj = hits[0].object;
                while(hitObj.parent && hitObj.parent !== markerGroup) hitObj = hitObj.parent;
                const idx = markerGroup.children.indexOf(hitObj);
                if (idx >= 0) {
                    const midx = Math.floor(idx / 2);
                    if (midx < attractions.length) showDetail(attractions[midx]);
                }
            }
        });

        // Search
        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) { resultsDiv.style.display = 'none'; return; }
            const filtered = attractions.filter(a =>
                a.name.toLowerCase().includes(q) || a.region.toLowerCase().includes(q) ||
                a.category.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
            );
            resultsDiv.innerHTML = '';
            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="result-item" style="text-align:center;opacity:0.6;">\uD83D\uDE05 검색 결과가 없습니다.</div>';
                resultsDiv.style.display = 'block'; return;
            }
            filtered.forEach(a => {
                const item = document.createElement('div');
                item.className = 'result-item';
                const hex = (clr[a.category]||0xffffff).toString(16).padStart(6,'0');
                item.innerHTML = '<div class="top-row"><h3>' + a.name + '</h3><span class="category" style="background:#' + hex + '">' + a.category + '</span></div><div class="region">\uD83D\uDCCD ' + a.region + '</div><div class="desc">' + a.desc + '</div>';
                item.addEventListener('click', () => { showDetail(a); });
                resultsDiv.appendChild(item);
            });
            resultsDiv.style.display = 'block';
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        let dt;
        searchInput.addEventListener('input', () => { clearTimeout(dt); dt = setTimeout(doSearch, 300); });

        document.addEventListener('click', e => {
            if (!resultsDiv.contains(e.target) && e.target !== searchInput && e.target !== searchBtn) {
                if (!detailPanel.contains(e.target)) {
                    resultsDiv.style.display = 'none';
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        console.log('\u2705 대한민국 관광명소 3D 지도 로딩 완료! (총 ' + attractions.length + '개 명소)');
    </script>
</body>
</html>
</html>
