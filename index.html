    <style>
        :root{--bg:#fff;--card:rgba(255,255,255,0.92);--text:#1a1a2e;--t2:#6b7280;--t3:#9ca3af;--bd:rgba(0,0,0,0.05);--ac:#e8b44f;--ac2:#f0c96d;--gr1:linear-gradient(135deg,#e8b44f,#f0c96d);--gr2:linear-gradient(135deg,#e8b44f,#d4956b);--shadow:0 4px 20px rgba(0,0,0,0.04);--shadow-h:0 8px 32px rgba(0,0,0,0.08);--rd:16px;--rs:10px;--rf:9999px}

        #hero .badge{display:inline-block;padding:4px 14px;background:var(--gr1);border-radius:var(--rf);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px}

        .festival-map-marker{width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:#d4956b;color:#fff;font:700 12px 'Noto Sans KR',sans-serif;box-shadow:0 2px 9px rgba(93,78,55,.3);cursor:pointer;display:flex;align-items:center;justify-content:center}

        .result-item.skeleton-item{pointer-events:none;padding:16px 18px}

        .result-item .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
        .result-item h3{font-size:15px;font-weight:700}
        .result-item .badge{font-size:9px;padding:3px 10px;border-radius:var(--rf);color:#fff;flex-shrink:0;font-weight:600}
        .result-item .r{font-size:12px;color:var(--t2);margin-top:4px;display:flex;align-items:center;gap:8px}
        .result-item .r .dist{color:#d4956b;font-size:11px;font-weight:600}

        #counter span{color:var(--text);font-weight:700}
        #current-loc-btn,#install-btn2{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(16px);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.2s;flex-shrink:0}
        #current-loc-btn:hover,#install-btn2:hover{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.05)}
        #install-btn2{display:none}
        #detail-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.15);display:none}
        #detail-panel{position:fixed;bottom:0;left:0;right:0;z-index:2001;background:var(--card);backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);border-radius:20px 20px 0 0;border-top:1px solid var(--bd);padding:16px 24px 24px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.32,0.72,0,1)}

        #detail-panel h2{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:2px}
        #detail-panel .r-line{font-size:13px;color:var(--t2);margin-bottom:8px}
        #detail-panel .d-text{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:8px}
        #detail-panel .t-box{font-size:13px;line-height:1.5;color:var(--t2);padding:10px 14px;background:rgba(232,180,79,0.06);border-left:3px solid var(--ac);border-radius:0 var(--rs) var(--rs) 0;margin-bottom:12px}
        #detail-panel .t-box b{color:#d4956b;font-weight:600}
        #detail-panel .actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);padding-top:12px;z-index:1}
        #detail-panel .actions a,#detail-panel .actions button{flex:1;padding:11px 16px;border-radius:var(--rs);text-decoration:none;font-size:13px;font-weight:600;text-align:center;transition:all 0.2s;border:none;font-family:inherit;cursor:pointer;min-width:120px}
        #detail-panel .actions .navi{background:var(--gr1);color:#fff}#detail-panel .actions .navi2{background:#f7e600;color:#333}
        #detail-panel .actions .navi:hover{opacity:0.9;transform:translateY(-1px)}

        .kakao-info{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;color:var(--text);font:600 13px `"Noto Sans KR`",sans-serif;box-shadow:var(--shadow)}
        .popup-c{padding:6px 4px;min-width:180px;max-width:260px}
        .popup-c h3{font-size:15px;font-weight:700;margin-bottom:2px}
        .popup-c .tag{display:inline-block;padding:2px 10px;border-radius:var(--rf);font-size:9px;font-weight:600;color:#fff;margin-bottom:4px}
        .popup-c .r{font-size:11px;color:var(--t2);margin-bottom:4px}.popup-c .d{font-size:12px;line-height:1.5;color:var(--t2)}
        .popup-c .t{font-size:11px;color:var(--text);padding:6px 10px;background:rgba(232,180,79,0.06);border-left:2px solid #d4956b;border-radius:0 6px 6px 0;margin-top:4px}
        .popup-c .t b{color:#d4956b}
        #install-banner{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:999;background:var(--card);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--bd);border-radius:var(--rd);padding:12px 18px;display:none;align-items:center;gap:12px;width:92%;max-width:400px}
        #install-banner .ib-icon{font-size:28px}
        #install-banner .ib-text{flex:1;font-size:12px;font-weight:600;line-height:1.4;color:var(--text)}
        #install-banner .ib-text small{font-size:11px;color:var(--t2);font-weight:400;display:block}
        #install-banner .ib-btn{padding:8px 18px;border:none;border-radius:var(--rs);background:var(--gr1);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
        #install-banner .ib-close{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:4px}
        @media(max-width:600px){
            #hero{padding:16px 16px 44px}#hero h1{font-size:22px}#hero .sub{font-size:12px}
            #search-wrap{top:92px;padding:3px 3px 3px 14px}#search-input{font-size:13px;padding:9px 0}#search-btn{padding:9px 18px;font-size:12px}
            #filter-bar{top:148px}.filter-btn{padding:5px 12px;font-size:10px}#results{top:194px}
            #detail-panel{padding:14px 16px 28px}#detail-panel h2{font-size:18px}

            #current-loc-btn,#install-btn2{width:36px;height:36px;font-size:14px}#install-banner{bottom:64px}
        }
    </style>
</head>
<body>
    <div id="loading-screen"><div class="spinner"></div><p>관광명소를 불러오는 중...</p></div>

    <div id="hero">
        <div class="badge">K-TRAVEL</div>

    </div>
    <div id="filter-bar">

        <button id="install-btn2" onclick="installApp()" title="앱 설치">📲</button>

    <script>
        window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loading-screen').classList.add('hidden')},400)});

        function setView(view){
            activeView=view;
            document.querySelectorAll(".view-switch button").forEach(function(b){b.classList.toggle("active",b.dataset.view===view)});
            var places=view==="places";
            $("search-wrap").style.display=places?"flex":"none";
            $("filter-bar").style.display=places?"flex":"none";
            $("festival-tools").style.display=places?"none":"flex";
            $("festival-results").style.display=places?"none":"block";
            $("results").style.display="none";
            markers.forEach(function(m){m.overlay.setMap(places?map:null)});
            festivalMarkers.forEach(function(m){m.setMap(places?null:map)});
            if(!places){initFestivalMarkers();festivalMarkers.forEach(function(m){m.setMap(map)});renderFestivals()}
            setTimeout(function(){if(map)map.relayout()},80);
        }

        function renderFestivals(){
            var q=$("festival-search").value.trim().toLowerCase(),region=$("festival-region").value;
            var rows=FESTIVALS.filter(function(f){return (region==="all"||f.region.indexOf(region)>=0)&&(!q||(f.name+f.region+f.place+f.desc).toLowerCase().indexOf(q)>=0)});

            if(!rows.length)html+='<div class="festival-item" style="text-align:center;color:var(--t2)">조건에 맞는 축제가 없습니다.</div>';
            rows.forEach(function(f){var i=FESTIVALS.indexOf(f);html+='<article class="festival-item" tabindex="0" data-festival="'+i+'"><h3>'+f.name+'</h3><div class="meta"><span class="dates">'+f.start+'</span> · '+f.region+'<br>📍 '+f.place+'<br>'+f.desc+'</div></article>'});
            list.innerHTML=html;list.style.display=activeView==="festivals"?"block":"none";
            list.querySelectorAll("[data-festival]").forEach(function(card){card.addEventListener("click",function(){focusFestival(Number(this.dataset.festival))});card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();focusFestival(Number(this.dataset.festival))}})});
        }

        function focusFestival(i){

            $("dt-coords").textContent="📌 "+f.lat+", "+f.lng;

        Array.from(new Set(FESTIVALS.map(function(f){return f.region.split(" ")[0]}))).sort().forEach(function(r){var o=document.createElement("option");o.value=r;o.textContent=r;$("festival-region").appendChild(o)});
function installApp(){if(_installEvent){_installEvent.prompt();_installEvent.userChoice.then(function(){document.getElementById("install-btn2").style.display="none";$("install-banner").style.display="none"})}else{alert("브라우저에서 설치를 지원하지 않거나 이미 설치되었습니다.")}}
function _checkInstall(){if(window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone===true){document.getElementById("install-btn2").style.display="none"}}
function locateMe(){if(!navigator.geolocation){alert("GPS를 지원하지 않습니다");return}$("current-loc-btn").textContent="⏳";navigator.geolocation.getCurrentPosition(function(p){_curLat=p.coords.latitude;_curLng=p.coords.longitude;map.setCenter(new kakao.maps.LatLng(_curLat,_curLng));map.setLevel(5);var current=new kakao.maps.Marker({position:new kakao.maps.LatLng(_curLat,_curLng)});current.setMap(map);$("current-loc-btn").textContent="📍";findNearby()},function(){$("current-loc-btn").textContent="📍"})}
function findNearby(){if(!_curLat||!_curLng)return;var sorted=D.map(function(a,i){return{idx:i,dist:getDistance(_curLat,_curLng,a.a,a.o)}}).sort(function(a,b){return a.dist-b.dist});var html='<div style="padding:12px 16px;margin-bottom:6px;background:var(--card);border:1px solid rgba(232,180,79,0.2);border-radius:var(--rd);color:#d4956b;font-size:12px;font-weight:600">📍 내 주변 명소</div>';sorted.slice(0,5).forEach(function(s){var a=D[s.idx],c=CC[a.c]||"#e8b44f",d=s.dist<1?(Math.round(s.dist*1000)+"m"):(s.dist.toFixed(1)+"km");html+='<div class=result-item onclick="showDetail('+s.idx+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span><span class=dist>'+d+'</span></div></div>'});showSkeleton(3);setTimeout(function(){$("results").innerHTML=html;$("results").style.display="block"},300)}
function getDistance(lat1,lng1,lat2,lng2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function showSkeleton(c){var h="";for(var i=0;i<c;i++){h+='<div class="result-item skeleton-item"><div class="t"><div class="skeleton skeleton-text" style="margin:0"></div><div class="skeleton skeleton-badge"></div></div><div class="r" style="margin-top:8px"><div class="skeleton skeleton-text-short" style="margin:0"></div></div></div>'}$("results").innerHTML=h;$("results").style.display="block"}
var _searchTimer=null;
function doSearch(){var q=$("search-input").value.trim().toLowerCase();if(!q){$("results").style.display="none";return}showSkeleton(3);clearTimeout(_searchTimer);_searchTimer=setTimeout(function(){var f=D.filter(function(a){return a.n.toLowerCase().indexOf(q)>=0||a.r.toLowerCase().indexOf(q)>=0||a.c.toLowerCase().indexOf(q)>=0});var h="";if(!f.length){h='<div style="padding:16px;text-align:center;color:var(--t3)">😅 검색 결과가 없습니다</div>'}else{f.forEach(function(a){var c=CC[a.c]||"#e8b44f";h+='<div class=result-item onclick="showDetail('+D.indexOf(a)+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span></div></div>'})}$("results").innerHTML=h},400)}
$("search-btn").addEventListener("click",function(){var q=$("search-input").value.trim();if(q)doSearch()});
$("search-input").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
var dt;$("search-input").addEventListener("input",function(){clearTimeout(dt);dt=setTimeout(doSearch,300)});
$("results").addEventListener("click",function(e){e.stopPropagation()});
document.addEventListener("click",function(){$("results").style.display="none"});
document.querySelectorAll(".filter-btn").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});this.classList.add("active");catFilter=this.getAttribute("data-cat");markers.forEach(function(m){var a=D[m._idx];if(catFilter==="all")m.overlay.setMap(map);else m.overlay.setMap(a.c===catFilter?map:null)})})});
function showDetail(i){_selIdx=i;var a=D[i],c=CC[a.c]||"#e8b44f";$("dt-cat").textContent=a.c;$("dt-cat").style.background=c;$("dt-name").textContent=a.n;$("dt-region").textContent="📍 "+a.r;$("dt-desc").textContent=a.d;$("dt-tip").innerHTML="<b>💡 여행 팁</b><br>"+a.t;$("dt-navi2").href="https://map.kakao.com/link/to/"+encodeURIComponent(a.n)+","+a.a+","+a.o;$("dt-coords").textContent="📌 "+a.a+", "+a.o;var isW=_wish.indexOf(i)>=0;$("dt-wish").textContent=isW?"❤️ 찜 완료":"🤍 찜하기";$("detail-overlay").style.display="block";$("detail-panel").classList.add("open")}
function closeDetail(){$("detail-overlay").style.display="none";$("detail-panel").classList.remove("open")}
function toggleWish(){if(_selIdx<0)return;var idx=_wish.indexOf(_selIdx);if(idx>=0){_wish.splice(idx,1);$("dt-wish").textContent="🤍 찜하기"}else{_wish.push(_selIdx);$("dt-wish").textContent="❤️ 찜 완료"}localStorage.setItem("ktour_wish",JSON.stringify(_wish))}
_checkInstall();
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();_installEvent=e;$("install-banner").style.display="flex";document.getElementById("install-btn2").style.display="flex"});
$("install-btn").addEventListener("click",function(){if(!_installEvent)return;_installEvent.prompt();_installEvent.userChoice.then(function(){$("install-banner").style.display="none"})});
window.addEventListener("resize",function(){if(map)map.relayout()});
    </script>
</body>
