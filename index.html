<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 관광명소</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Noto Sans KR',sans-serif; overflow:hidden; background:#fff; height:100vh; }

        #map {
            position:fixed; inset:0;
            z-index:1;
            filter: saturate(1.05) contrast(1.02);
        }

        /* 일반적인 지도 느낌의 Leaflet 컨트롤 */
        .leaflet-control-zoom a {
            background:#fff !important;
            color:#333 !important;
            border:1px solid #ddd !important;
            width:34px !important; height:34px !important;
            line-height:34px !important;
            font-size:16px !important;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        .leaflet-control-zoom { border:none !important; }
        .leaflet-control-attribution { background:rgba(255,255,255,0.85) !important; color:#999 !important; font-size:10px !important; }
        .leaflet-control-attribution a { color:#999 !important; }

        /* 헤더 */
        #header {
            position:fixed; top:16px; left:50%; transform:translateX(-50%);
            z-index:1000;
            background:#fff;
            border:1px solid #e5e7eb;
            padding:10px 28px;
            border-radius:16px;
            box-shadow:0 4px 24px rgba(0,0,0,0.08);
            text-align:center;
            pointer-events:none;
        }
        #header h1 { font-size:17px; font-weight:900; color:#1f2937; letter-spacing:-0.5px; }
        #header h1 span { color:#e74c3c; }
        #header small { display:block; font-size:10px; font-weight:400; color:#9ca3af; margin-top:1px; letter-spacing:1px; }

        /* 검색창 */
        #search-wrap {
            position:fixed; top:78px; left:50%; transform:translateX(-50%);
            z-index:1000;
            width:92%; max-width:480px;
            background:#fff;
            border:1px solid #e5e7eb;
            border-radius:14px;
            box-shadow:0 4px 20px rgba(0,0,0,0.06);
            display:flex;
            align-items:center;
            padding:4px 4px 4px 16px;
            transition:border-color 0.3s, box-shadow 0.3s;
        }
        #search-wrap:focus-within {
            border-color:#e74c3c;
            box-shadow:0 4px 20px rgba(231,76,60,0.15);
        }
        #search-input {
            flex:1; background:none; border:none; outline:none;
            color:#1f2937; font-size:14px; font-family:inherit;
            padding:8px 0;
        }
        #search-input::placeholder { color:#9ca3af; }
        #search-btn {
            padding:8px 20px; border:none; border-radius:10px;
            background:#e74c3c; color:#fff;
            font-size:13px; font-weight:600; cursor:pointer;
            font-family:inherit; flex-shrink:0;
            transition:background 0.2s, transform 0.15s;
        }
        #search-btn:hover { background:#c0392b; }
        #search-btn:active { transform:scale(0.96); }

        /* 검색 결과 */
        #results {
            position:fixed; top:130px; left:50%; transform:translateX(-50%);
            z-index:1000;
            width:92%; max-width:480px;
            max-height:calc(100vh - 170px);
            overflow-y:auto;
            display:none;
        }
        #results::-webkit-scrollbar { width:4px; }
        #results::-webkit-scrollbar-thumb { background:#ddd; border-radius:2px; }

        .result-item {
            background:#fff;
            border:1px solid #e5e7eb;
            padding:13px 16px;
            margin-bottom:5px;
            border-radius:12px;
            cursor:pointer;
            transition:all 0.2s;
            box-shadow:0 2px 8px rgba(0,0,0,0.04);
        }
        .result-item:hover {
            border-color:#e74c3c;
            box-shadow:0 4px 16px rgba(231,76,60,0.1);
            transform:translateX(3px);
        }
        .result-item .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        .result-item h3 { font-size:14px; font-weight:700; color:#1f2937; }
        .result-item .badge {
            font-size:10px; font-weight:600;
            padding:2px 10px; border-radius:999px;
            color:#fff; flex-shrink:0;
        }
        .result-item .rgn { font-size:12px; color:#6b7280; margin-top:3px; }

        /* 팝업 */
        .custom-popup .leaflet-popup-content-wrapper {
            background:#fff;
            border-radius:14px;
            box-shadow:0 8px 32px rgba(0,0,0,0.12);
            border:1px solid #e5e7eb;
            padding:2px;
        }
        .custom-popup .leaflet-popup-tip { background:#fff; border:1px solid #e5e7eb; }
        .custom-popup .leaflet-popup-close-button {
            color:#9ca3af !important; font-size:16px !important;
            top:6px !important; right:6px !important;
        }
        .popup-content { padding:8px 4px; min-width:200px; max-width:280px; }
        .popup-content h3 { font-size:16px; font-weight:700; color:#1f2937; margin-bottom:3px; }
        .popup-content .tag {
            display:inline-block; padding:2px 10px; border-radius:999px;
            font-size:10px; font-weight:600; color:#fff; margin-bottom:5px;
        }
        .popup-content .r { font-size:12px; color:#6b7280; margin-bottom:6px; }
        .popup-content .d { font-size:13px; line-height:1.6; color:#4b5563; margin-bottom:6px; }
        .popup-content .t {
            font-size:12px; line-height:1.5; color:#1f2937;
            padding:8px 10px; background:#fef2f2; border-left:3px solid #e74c3c;
            border-radius:0 8px 8px 0; margin-bottom:4px;
        }
        .popup-content .t b { color:#e74c3c; }
        .popup-content .c { font-size:10px; color:#9ca3af; }

        #counter {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            z-index:1000;
            background:#fff;
            border:1px solid #e5e7eb;
            padding:6px 20px;
            border-radius:999px;
            font-size:12px;
            color:#6b7280;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
            pointer-events:none;
        }
        #counter span { color:#e74c3c; font-weight:700; }

        @media (max-width:600px) {
            #header { padding:8px 16px; top:10px; }
            #header h1 { font-size:15px; }
            #search-wrap { top:66px; padding:3px 3px 3px 12px; }
            #search-input { font-size:13px; }
            #search-btn { padding:7px 14px; font-size:12px; }
            #results { top:114px; }
            .result-item { padding:11px 14px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="header"><h1>🇰🇷 한국 관광명소 <span>40선</span></h1><small>지도를 클릭하면 상세 정보를 볼 수 있습니다</small></div>
    <div id="search-wrap">
        <span style="font-size:15px;opacity:0.4;margin-right:8px;flex-shrink:0;">🔍</span>
        <input type="text" id="search-input" autocomplete="off" placeholder="명소나 지역을 검색하세요...">
        <button id="search-btn">검색</button>
    </div>
    <div id="results"></div>
    <div id="counter"><span id="cn">40</span>곳의 대한민국 관광명소</div>    <script>
        const attractions = [
            {name:'경복궁',region:'서울',lat:37.5796,lng:126.9770,cat:'궁궐/역사',desc:'조선 왕조의 법궁, 1395년 창건. 근정전과 경회루가 웅장한 서울 대표 유적지.',tip:'한복 입고 방문 시 무료 입장! 국립민속박물관도 함께 들러보세요.'},

            {name:'북촌한옥마을',region:'서울',lat:37.5826,lng:126.9850,cat:'문화/전통',desc:'전통 한옥이 보존된 서울 도심 속 역사 마을. 골목골목 정취가 가득.',tip:'조용한 주택가이니 방문 시 주의! 북촌 8경 코스를 따라 걸어보세요.'},
            {name:'명동',region:'서울',lat:37.5609,lng:126.9853,cat:'쇼핑/거리',desc:'서울 최대 쇼핑과 먹거리 천국. 명동성당도 인근에 위치.',tip:'저녁 시간이 더 활기참! 길거리 음식 중 떡볶이와 통닭꼬치가 인기.'},
            {name:'인사동',region:'서울',lat:37.5736,lng:126.9855,cat:'문화/전통',desc:'전통 문화와 현대 예술이 공존하는 서울의 문화 거리.',tip:'쌈지길에서 다양한 공예품 구경! 전통 찻집에서 여유도 즐기세요.'},

            {name:'석굴암',region:'경주',lat:35.7951,lng:129.3492,cat:'사찰/역사',desc:'통일신라 불교 조각 예술의 정수. UNESCO 세계문화유산.',tip:'사진 촬영이 제한되니 눈에 담아오세요.'},
            {name:'안동하회마을',region:'경북',lat:36.5392,lng:128.5172,cat:'전통/마을',desc:'조선 양반 마을 원형 보존. UNESCO 세계문화유산.',tip:'낙동강에서 배 타고 마을 전체 조망! 탈박물관도 필수 방문.'},

            {name:'용인에버랜드',region:'경기',lat:37.2935,lng:127.2070,cat:'테마파크',desc:'한국 최대 테마파크. 사계절 다양한 축제와 놀이기구.',tip:'주말에는 꼭 미리 예약! 판다월드 푸바오가 인기 만점입니다.'},
            {name:'포항죽도시장',region:'경북',lat:36.0180,lng:129.3657,cat:'맛집/시장',desc:'과메기와 물회의 본고장. 포항 대표 전통시장.',tip:'과메기 정식과 물회가 시장의 대표 메뉴! 꼭 맛보세요.'},
            {name:'속초관광수산시장',region:'강원',lat:38.2072,lng:128.5921,cat:'맛집/시장',desc:'강원도 대표 시장. 오징어순대와 닭강정이 유명.',tip:'닭강정과 오징어순대 필수 코스! 속초해수욕장도 함께.'},
            {name:'철원 DMZ',region:'강원',lat:38.2220,lng:127.2140,cat:'역사/평화',desc:'한반도 분단의 현장. 평화와 생태의 상징적인 장소.',tip:'출입증 필요! 철원 주상절리와 직탕폭포도 함께 구경.'},
            {name:'천안독립기념관',region:'충남',lat:36.7803,lng:127.2217,cat:'역사/기념관',desc:'한국 독립운동의 역사를 기리는 대표적인 기념관.',tip:'입장료 무료! 천안 삼거리도 함께 방문해보세요.'},
            {name:'공주무령왕릉',region:'충남',lat:36.4613,lng:127.1178,cat:'역사/유적',desc:'백제 시대 왕릉. 금관과 장신구 등 귀중한 유물이 출토된 곳.',tip:'국립공주박물관에서 유물 전시 중! 공산성도 함께 방문.'},
            {name:'부여백제문화단지',region:'충남',lat:36.2748,lng:126.9127,cat:'역사/문화',desc:'백제 역사와 문화를 재현한 대규모 테마파크.',tip:'부소산성과 낙화암도 함께! 백제문화제(9-10월)가 최고.'},
            {name:'충주호',region:'충북',lat:36.9712,lng:128.0019,cat:'자연/호수',desc:'청풍호반과 유람선이 아름다운 충북의 대표 호수.',tip:'유람선 타고 호수 둘러보기! 충주 탄금대도 방문해보세요.'},
            {name:'단양고수동굴',region:'충북',lat:36.9578,lng:128.3630,cat:'자연/동굴',desc:'천연동굴의 신비를 체험하는 충북 대표 명소.',tip:'도담삼봉과 만천하 스카이워크도 함께 즐기세요!'},
        ];

        // ===== Leaflet 지도 (일반 스타일) =====
        const map = L.map('map', {
            center: [36.0, 127.8],
            zoom: 7,
            minZoom: 6,
            maxZoom: 14,
            zoomControl: false
        });

        // 일반적인 지도 타일 (밝은 스타일)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // ===== 마커 (핀 모양 아이콘) =====
        const catColors = {
            '궁궐/역사':'#e74c3c','랜드마크':'#f97316','문화/전통':'#2ecc71','쇼핑/거리':'#9b59b6',
            '문화/거리':'#ec4899','쇼핑/업무':'#1abc9c','자연/섬':'#3498db','자연/산':'#27ae60',
            '자연/명소':'#1abc9c','해변/휴양':'#00bcd4','문화/마을':'#ff5722','맛집/시장':'#f59e0b',
            '역사/유적':'#8d6e63','사찰/역사':'#fbbf24','전통/마을':'#4caf50','공원/전시':'#2196f3',
            '자연/공원':'#009688','문화/전시':'#8b5cf6','테마파크':'#ff4081','역사/평화':'#795548',
            '역사/기념관':'#607d8b','역사/문화':'#84cc16','자연/호수':'#06b6d4','자연/동굴':'#795548',
        };

        const markers = [];

        attractions.forEach(a => {
            const color = catColors[a.cat] || '#8b5cf6';

            // Leaflet 기본 컬러 마커 사용 (더 지도처럼 보임)
            const icon = L.divIcon({
                html: `
                <div style="position:relative;width:28px;height:40px;">
                    <svg width="28" height="40" viewBox="0 0 28 40">
                        <path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
                        <circle cx="14" cy="13" r="6" fill="#fff"/>
                    </svg>
                </div>`,
                iconSize: [28, 40],
                iconAnchor: [14, 40],
                popupAnchor: [0, -42],
                className: ''
            });

            const marker = L.marker([a.lat, a.lng], { icon }).addTo(map);

            const popupHTML = `
                <div class="popup-content">
                    <h3>${a.name}</h3>
                    <span class="tag" style="background:${color}">${a.cat}</span>
                    <div class="r">📍 ${a.region}</div>
                    <div class="d">${a.desc}</div>
                    <div class="t"><b>💡 TIP</b><br>${a.tip}</div>
                    <div class="c">📌 ${a.lat.toFixed(4)}, ${a.lng.toFixed(4)}</div>
                </div>`;

            marker.bindPopup(popupHTML, { className:'custom-popup', maxWidth:320, closeButton:true });

            marker.on('mouseover', function() { this.openPopup(); });
            marker.on('mouseout', function() { this.closePopup(); });

            markers.push({ marker, data:a });
        });

        document.getElementById('cn').textContent = attractions.length;

        // ===== 검색 =====
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsDiv = document.getElementById('results');

        function doSearch() {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) { resultsDiv.style.display='none'; return; }
            const filtered = attractions.filter(a =>
                a.name.toLowerCase().includes(q) || a.region.toLowerCase().includes(q) ||
                a.cat.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
            );
            resultsDiv.innerHTML = '';
            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="result-item" style="text-align:center;color:#9ca3af;padding:20px;">😅 검색 결과가 없습니다</div>';
                resultsDiv.style.display='block'; return;
            }
            filtered.forEach(a => {
                const el = document.createElement('div');
                el.className = 'result-item';
                const color = catColors[a.cat] || '#8b5cf6';
                el.innerHTML = `<div class="top"><h3>${a.name}</h3><span class="badge" style="background:${color}">${a.cat}</span></div><div class="rgn">📍 ${a.region}</div>`;
                el.addEventListener('click', () => {
                    map.setView([a.lat, a.lng], 12, { animate:true, duration:0.5 });
                    resultsDiv.style.display='none';
                    searchInput.value = a.name;
                    const found = markers.find(m => m.data.name === a.name);
                    if (found) setTimeout(() => found.marker.openPopup(), 600);
                });
                resultsDiv.appendChild(el);
            });
            resultsDiv.style.display='block';
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        let dt;
        searchInput.addEventListener('input', () => { clearTimeout(dt); dt=setTimeout(doSearch,250); });
        document.addEventListener('click', e => {
            if(!resultsDiv.contains(e.target) && !e.target.closest('#search-wrap')) resultsDiv.style.display='none';
        });

        console.log('✅ 지도 로딩 완료! (' + attractions.length + '개 명소)');
    </script>
</body>
</html>
