    <style>
        :root {
            --bg: #ffffff;
            --card: rgba(255,255,255,0.92);
            --text: #1a1a2e;
            --t2: #6b7280;
            --t3: #9ca3af;
            --bd: rgba(0,0,0,0.05);
            --ac: #e8b44f;
            --ac2: #f0c96d;
            --gr1: linear-gradient(135deg, #e8b44f, #f0c96d);
            --gr2: linear-gradient(135deg, #e8b44f, #d4956b);
            --shadow: 0 4px 20px rgba(0,0,0,0.04);
            --shadow-h: 0 8px 32px rgba(0,0,0,0.08);
            --rd: 16px;
            --rs: 10px;
            --rf: 9999px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans KR',-apple-system,sans-serif;overflow:hidden;background:var(--bg);height:100vh;color:var(--text)}

        /* 스켈레톤 로딩 애니메이션 */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--rs);
        }
        .skeleton-text { height: 14px; margin-bottom: 8px; width: 60%; }
        .skeleton-text-short { height: 14px; margin-bottom: 8px; width: 35%; }
        .skeleton-badge { height: 18px; width: 50px; border-radius: var(--rf); display: inline-block; }

        /* 초기 로딩 화면 */
        #loading-screen {
            position:fixed; inset:0; z-index:9999;
            background:var(--bg);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            transition:opacity 0.5s, visibility 0.5s;
        }
        #loading-screen.hidden { opacity:0; visibility:hidden; }
        #loading-screen .spinner {
            width:36px; height:36px;
            border:3px solid var(--bd);
            border-top-color:var(--ac);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            margin-bottom:16px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        #loading-screen p { font-size:14px; color:var(--t2); }

        #map {
            position:fixed; inset:0; z-index:1;
        }
        .leaflet-control-zoom a{
            background:var(--card)!important;color:var(--text)!important;
            border:1px solid var(--bd)!important;
            backdrop-filter:blur(16px)!important;
            width:36px!important;height:36px!important;line-height:36px!important;
            font-size:16px!important;box-shadow:var(--shadow)!important;
        }
        .leaflet-control-attribution{background:rgba(255,255,255,0.85)!important;color:var(--t3)!important;font-size:9px!important}
        .leaflet-control-attribution a{color:var(--t3)!important}

        #hero {
            position:fixed; top:0; left:0; right:0; z-index:1000;
            padding:24px 24px 56px;
            background:linear-gradient(180deg,rgba(255,255,255,0.95) 40%,rgba(255,255,255,0));
            pointer-events:none;
        }
        #hero .badge {
            display:inline-block;padding:4px 14px;
            background:var(--gr1);border-radius:var(--rf);
            color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px;
        }
        #hero h1 {font-size:30px;font-weight:900;letter-spacing:-1.5px;color:var(--text);line-height:1.15;margin-bottom:3px;}
        #hero h1 span {background:var(--gr2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        #hero .sub {font-size:14px;color:var(--t2);font-weight:400;}
        #hero .sub b {color:var(--ac);font-weight:600;}

        #search-wrap {
            position:fixed; top:114px; left:50%; transform:translateX(-50%); z-index:1000;
            width:92%; max-width:520px;
            background:var(--card);backdrop-filter:blur(24px) saturate(1.4);
            -webkit-backdrop-filter:blur(24px) saturate(1.4);
            border:1px solid var(--bd);border-radius:var(--rd);
            box-shadow:var(--shadow-h);
            display:flex;align-items:center;
            padding:4px 4px 4px 20px;transition:all 0.3s;
        }
        #search-wrap:focus-within {
            border-color:rgba(232,180,79,0.3);
            box-shadow:0 8px 40px rgba(232,180,79,0.1),0 0 0 3px rgba(232,180,79,0.08);
        }
        #search-icon{font-size:18px;opacity:0.3;margin-right:12px;flex-shrink:0}
        #search-input{
            flex:1;background:none;border:none;outline:none;
            color:var(--text);font-size:15px;font-weight:400;
            font-family:inherit;padding:11px 0;
        }
        #search-input::placeholder{color:var(--t3);font-weight:300}
        #search-btn{
            padding:10px 24px;border:none;border-radius:var(--rs);
            background:var(--gr1);color:#fff;
            font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0;
            transition:all 0.25s;box-shadow:0 4px 16px rgba(232,180,79,0.3);
        }
        #search-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,180,79,0.4)}
        #search-btn:active{transform:scale(0.96)}

        #filter-bar {
            position:fixed; top:172px; left:50%; transform:translateX(-50%); z-index:1000;
            display:flex; gap:5px; flex-wrap:nowrap;
            width:92%; max-width:520px; overflow-x:auto;
            padding:2px 0;-webkit-overflow-scrolling:touch;
        }
        #filter-bar::-webkit-scrollbar{display:none}
        .filter-btn {
            padding:6px 16px;border:1px solid var(--bd);border-radius:var(--rf);
            background:var(--card);backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            color:var(--t2);font-size:11px;font-weight:500;cursor:pointer;
            font-family:inherit;white-space:nowrap;flex-shrink:0;
            transition:all 0.2s;
        }
        .filter-btn:hover{border-color:rgba(232,180,79,0.3);color:var(--text)}
        .filter-btn.active{
            background:var(--gr1);color:#fff;border-color:transparent;
            box-shadow:0 4px 16px rgba(232,180,79,0.25);
        }

        #results{
            position:fixed; top:222px; left:50%; transform:translateX(-50%); z-index:1000;
            width:92%; max-width:520px;
            max-height:calc(100vh-255px); overflow-y:auto; display:none;
        }
        #results::-webkit-scrollbar{width:3px}
        #results::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.06);border-radius:2px}
        .result-item{
            background:var(--card);backdrop-filter:blur(24px) saturate(1.4);
            -webkit-backdrop-filter:blur(24px) saturate(1.4);
            border:1px solid var(--bd);
            padding:14px 18px;margin-bottom:6px;border-radius:var(--rd);
            cursor:pointer;transition:all 0.25s;
            animation:rfade 0.25s ease;
        }
        .result-item.skeleton-item { pointer-events:none; padding:16px 18px; }
        @keyframes rfade{from{opacity:0;transform:translateY(-8px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .result-item:hover{border-color:rgba(232,180,79,0.2);box-shadow:var(--shadow-h);transform:translateX(4px)}
        .result-item .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
        .result-item h3{font-size:15px;font-weight:700}
        .result-item .badge{font-size:9px;padding:3px 10px;border-radius:var(--rf);color:#fff;flex-shrink:0;font-weight:600}
        .result-item .r{font-size:12px;color:var(--t2);margin-top:4px;display:flex;align-items:center;gap:8px}
        .result-item .r .dist{color:#d4956b;font-size:11px;font-weight:600}

        #bottom-bar {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:500;
            display:flex; align-items:center; gap:6px;
        }
        #counter{
            background:var(--card);backdrop-filter:blur(16px) saturate(1.4);
            -webkit-backdrop-filter:blur(16px) saturate(1.4);
            border:1px solid var(--bd);padding:7px 18px;border-radius:var(--rf);
            font-size:12px;color:var(--t2);pointer-events:none;
        }
        #counter span{color:var(--text);font-weight:700}
        #current-loc-btn, #install-btn2{
            width:40px;height:40px;border-radius:50%;
            background:var(--card);border:1px solid var(--bd);
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            font-size:16px;transition:all 0.2s;flex-shrink:0;
        }
        #current-loc-btn:hover{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.05)}
        #install-btn2{display:none}
        #install-btn2:hover{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.05)}

        #detail-overlay{
            position:fixed;inset:0;z-index:2000;
            background:rgba(0,0,0,0.15);display:none;
        }
        #detail-panel{
            position:fixed;bottom:0;left:0;right:0;z-index:2001;
            background:var(--card);backdrop-filter:blur(32px) saturate(1.5);
            -webkit-backdrop-filter:blur(32px) saturate(1.5);
            border-radius:20px 20px 0 0;
            border-top:1px solid var(--bd);
            padding:16px 24px 24px;
            max-height:92vh;overflow-y:auto;
            transform:translateY(100%);
            transition:transform 0.4s cubic-bezier(0.32,0.72,0,1);
        }
        #detail-panel.open{transform:translateY(0)}
        #detail-panel .handle{width:32px;height:4px;background:var(--t3);border-radius:2px;margin:0 auto 14px;opacity:0.2}
        #detail-panel .top-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
        #detail-panel .cat-tag{display:inline-block;padding:3px 12px;border-radius:var(--rf);font-size:10px;font-weight:700;color:#fff;letter-spacing:0.5px}
        #detail-panel h2{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:2px}
        #detail-panel .r-line{font-size:13px;color:var(--t2);margin-bottom:8px}
        #detail-panel .d-text{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:8px}
        #detail-panel .t-box{
            font-size:13px;line-height:1.5;color:var(--t2);
            padding:10px 14px;background:rgba(232,180,79,0.06);
            border-left:3px solid var(--ac);
            border-radius:0 var(--rs) var(--rs) 0;margin-bottom:12px;
        }
        #detail-panel .t-box b{color:#d4956b;font-weight:600}
        #detail-panel .actions{
            display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;
            background:var(--card);padding-top:12px;z-index:1;
        }
        #detail-panel .actions a,#detail-panel .actions button{
            flex:1;padding:11px 16px;border-radius:var(--rs);
            text-decoration:none;font-size:13px;font-weight:600;
            text-align:center;transition:all 0.2s;border:none;
            font-family:inherit;cursor:pointer;min-width:120px;
        }
        #detail-panel .actions .navi{background:var(--gr1);color:#fff;}
        #detail-panel .actions .navi:hover{opacity:0.9;transform:translateY(-1px)}
        #detail-panel .actions .wish{background:rgba(232,180,79,0.08);color:var(--text)}
        #detail-panel .actions .wish:hover{background:rgba(232,180,79,0.15)}
        #detail-panel .coord-text{font-size:10px;color:var(--t3);margin-top:8px}
        #detail-panel .close-detail{
            position:absolute;top:14px;right:18px;
            background:rgba(0,0,0,0.03);border:none;border-radius:50%;
            width:32px;height:32px;font-size:16px;color:var(--t2);
            cursor:pointer;display:flex;align-items:center;justify-content:center;
        }
        #detail-panel .close-detail:hover{background:rgba(0,0,0,0.06);color:var(--text)}

        .custom-popup .leaflet-popup-content-wrapper{
            background:var(--card);backdrop-filter:blur(24px) saturate(1.4);
            border-radius:var(--rd);box-shadow:var(--shadow-h);
            border:1px solid var(--bd);padding:2px;
        }
        .custom-popup .leaflet-popup-tip{background:var(--card)}
        .custom-popup .leaflet-popup-close-button{color:var(--t3)!important;top:4px!important;right:4px!important;opacity:0.5!important}
        .popup-c{padding:6px 4px;min-width:180px;max-width:260px}
        .popup-c h3{font-size:15px;font-weight:700;margin-bottom:2px}
        .popup-c .tag{display:inline-block;padding:2px 10px;border-radius:var(--rf);font-size:9px;font-weight:600;color:#fff;margin-bottom:4px}
        .popup-c .r{font-size:11px;color:var(--t2);margin-bottom:4px}
        .popup-c .d{font-size:12px;line-height:1.5;color:var(--t2)}
        .popup-c .t{font-size:11px;color:var(--text);padding:6px 10px;background:rgba(232,180,79,0.06);border-left:2px solid #d4956b;border-radius:0 6px 6px 0;margin-top:4px}
        .popup-c .t b{color:#d4956b}

        #install-banner{
            position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:999;
            background:var(--card);backdrop-filter:blur(24px) saturate(1.4);
            border:1px solid var(--bd);border-radius:var(--rd);
            padding:12px 18px;display:none;align-items:center;gap:12px;
            width:92%;max-width:400px;
        }
        #install-banner .ib-icon{font-size:28px}
        #install-banner .ib-text{flex:1;font-size:12px;font-weight:600;line-height:1.4;color:var(--text)}
        #install-banner .ib-text small{font-size:11px;color:var(--t2);font-weight:400;display:block}
        #install-banner .ib-btn{padding:8px 18px;border:none;border-radius:var(--rs);background:var(--gr1);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
        #install-banner .ib-close{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:4px}

        @media(max-width:600px){
            #hero{padding:16px 16px 44px}
            #hero h1{font-size:22px}#hero .sub{font-size:12px}
            #search-wrap{top:92px;padding:3px 3px 3px 14px}
            #search-input{font-size:13px;padding:9px 0}
            #search-btn{padding:9px 18px;font-size:12px}
            #filter-bar{top:148px}.filter-btn{padding:5px 12px;font-size:10px}
            #results{top:194px}
            #detail-panel{padding:14px 16px 20px}
            #detail-panel h2{font-size:18px}
            #bottom-bar{bottom:16px}#counter{font-size:11px;padding:6px 14px}
            #current-loc-btn,#install-btn2{width:36px;height:36px;font-size:14px}
            #install-banner{bottom:64px}
        }
    </style>
</head>
<body>
    <!-- 초기 로딩 화면 -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>관광명소를 불러오는 중...</p>
    </div>

    <div id="map"></div>

    <div id="hero">
        <div class="badge">K-TRAVEL</div>
        <h1>대한민국<br><span>관광명소</span> 검색</h1>
        <div class="sub"><b>40</b>개의 명소를 지도에서 찾아보세요</div>
    </div>

    <div id="search-wrap">
        <span id="search-icon">🔍</span>
        <input type="text" id="search-input" autocomplete="off" placeholder="관광명소를 검색해보세요">
        <button id="search-btn">검색</button>
    </div>

    <div id="filter-bar">
        <button class="filter-btn active" data-cat="all">전체</button>
        <button class="filter-btn" data-cat="역사">역사</button>
        <button class="filter-btn" data-cat="자연">자연</button>
        <button class="filter-btn" data-cat="문화">문화</button>
        <button class="filter-btn" data-cat="쇼핑">쇼핑</button>
        <button class="filter-btn" data-cat="맛집">맛집</button>
        <button class="filter-btn" data-cat="지역명소">지역명소</button>
    </div>

    <div id="results"></div>

    <div id="bottom-bar">
        <div id="counter">🇰🇷 <span id="cn">40</span>개 관광명소</div>
        <button id="install-btn2" onclick="installApp()" title="앱 설치">📲</button>
        <button id="current-loc-btn" title="내 위치" onclick="locateMe()">📍</button>
    </div>

    <div id="install-banner">
        <div class="ib-icon">📱</div>
        <div class="ib-text">K-TRAVEL 설치<small>홈 화면에 추가하여 앱처럼 이용</small></div>
        <button class="ib-btn" id="install-btn">설치</button>
        <button class="ib-close" onclick="this.parentElement.style.display='none'">✕</button>
    </div>

    <div id="detail-overlay" onclick="closeDetail()"></div>
    <div id="detail-panel">
        <button class="close-detail" onclick="closeDetail()">✕</button>
        <div class="handle"></div>
        <div class="top-row"><span class="cat-tag" id="dt-cat">데이터 로딩중</span></div>
        <h2 id="dt-name">로딩중...</h2>
        <div class="r-line" id="dt-region"></div>
        <div class="d-text" id="dt-desc"></div>
        <div class="t-box" id="dt-tip"><b>💡 여행 팁</b><br>로딩중입니다.</div>
        <div class="actions">
            <a class="navi" id="dt-navi" target="_blank">📍 길찾기</a>
            <button class="wish" id="dt-wish" onclick="toggleWish()">🤍 찜하기</button>
        </div>
        <div class="coord-text" id="dt-coords"></div>
    </div>    <script>
        // ===== 초기 로딩 화면 제거 =====
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 500);
        });

        if("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(function(e){console.log("SW error",e)});
        }

        // ===== 관광명소 데이터 =====

            {n:"에버랜드",r:"경기",a:37.2935,o:127.2070,c:"지역명소",d:"한국 최대 테마파크.",t:"주말 예약 필수!"},
            {n:"포항죽도시장",r:"경북",a:36.0180,o:129.3657,c:"맛집",d:"과메기와 물회 본고장.",t:"과메기 정식 필수!"},

            {n:"무령왕릉",r:"충남",a:36.4613,o:127.1178,c:"역사",d:"백제 시대 왕릉.",t:"국립공주박물관"},
            {n:"백제문화단지",r:"충남",a:36.2748,o:126.9127,c:"역사",d:"백제 역사 재현.",t:"부소산성도 함께!"},
            {n:"충주호",r:"충북",a:36.9712,o:128.0019,c:"자연",d:"청풍호반 유람선.",t:"유람선 타고 둘러보기!"},
            {n:"단양고수동굴",r:"충북",a:36.9578,o:128.3630,c:"자연",d:"천연동굴 체험.",t:"도담삼봉도 함께!"},
        ];

        var map, markers = [], _curLat, _curLng, _wish = [], _selIdx = -1, _installEvent = null;
        var catFilter = "all";
        var CC = {"역사":"#d4956b","지역명소":"#e8b44f","문화":"#b8a88e","쇼핑":"#c49b6e","자연":"#8fbc8f","맛집":"#d4956b"};

        // 찜하기 로드
        try{var w=localStorage.getItem("ktour_wish");if(w)_wish=JSON.parse(w)}catch(e){}

        function $(i){return document.getElementById(i)}

        // ===== 지도 =====
        map = L.map('map',{center:[36.0,127.8],zoom:7,minZoom:6,maxZoom:14,zoomControl:false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);
        L.control.zoom({position:'bottomright'}).addTo(map);

        D.forEach(function(a, i){
            var c = CC[a.c]||"#e8b44f";
            var icon = L.divIcon({
                html:'<div style="position:relative;width:28px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.15))"><svg width="28" height="40" viewBox="0 0 28 40"><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="'+c+'" stroke="#fff" stroke-width="1.8"/><circle cx="14" cy="13" r="6" fill="#fff"/></svg></div>',
                iconSize:[28,40],iconAnchor:[14,40],popupAnchor:[0,-42],className:''
            });
            var m = L.marker([a.a,a.o],{icon}).addTo(map);
            m._idx = i;
            var pop = '<div class="popup-c"><h3>'+a.n+'</h3><span class="tag" style="background:'+c+'">'+a.c+'</span><div class="r">📍 '+a.r+'</div><div class="d">'+a.d+'</div><div class="t"><b>💡 TIP</b><br>'+a.t+'</div></div>';
            m.bindPopup(pop,{className:'custom-popup',maxWidth:300,closeButton:true});
            m.on('click',function(){showDetail(this._idx)});
            markers.push(m);
        });
        $("cn").textContent = D.length;

        function installApp(){if(_installEvent){_installEvent.prompt();_installEvent.userChoice.then(function(){document.getElementById("install-btn2").style.display="none";$("install-banner").style.display="none"})}else{alert("브라우저에서 설치를 지원하지 않거나 이미 설치되었습니다.")}}

        function _checkInstall(){if(window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone===true){document.getElementById("install-btn2").style.display="none"}}

        function locateMe(){
            if(!navigator.geolocation){alert("GPS를 지원하지 않습니다");return}
            $("current-loc-btn").textContent = "⏳";
            navigator.geolocation.getCurrentPosition(function(p){
                _curLat = p.coords.latitude; _curLng = p.coords.longitude;
                map.setView([_curLat,_curLng],12,{animate:true});
                L.circleMarker([_curLat,_curLng],{radius:8,color:"#e8b44f",fillColor:"#e8b44f",fillOpacity:0.15}).addTo(map);
                $("current-loc-btn").textContent = "📍";
                findNearby();
            }, function(){$("current-loc-btn").textContent = "📍"});
        }

        function findNearby(){
            if(!_curLat||!_curLng) return;
            var sorted = D.map(function(a,i){return {idx:i,dist:getDistance(_curLat,_curLng,a.a,a.o)}}).sort(function(a,b){return a.dist-b.dist});
            var html = '<div style="padding:12px 16px;margin-bottom:6px;background:var(--card);border:1px solid rgba(232,180,79,0.2);border-radius:var(--rd);color:#d4956b;font-size:12px;font-weight:600">📍 내 주변 명소</div>';
            sorted.slice(0,5).forEach(function(s){
                var a = D[s.idx], c = CC[a.c]||"#e8b44f";
                var d = s.dist < 1 ? (Math.round(s.dist*1000)+"m") : (s.dist.toFixed(1)+"km");
                html += '<div class=result-item onclick="showDetail('+s.idx+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span><span class=dist>'+d+'</span></div></div>';
            });
            showSkeleton(3);
            setTimeout(function(){
                $("results").innerHTML = html; $("results").style.display = "block";
            }, 300);
        }

        function getDistance(lat1,lng1,lat2,lng2){
            var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
            var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
            return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
        }

        // ===== 스켈레톤 UI 표시 =====
        function showSkeleton(count){
            var html = "";
            for(var i=0;i<count;i++){
                html += '<div class="result-item skeleton-item"><div class="t"><div class="skeleton skeleton-text" style="margin:0"></div><div class="skeleton skeleton-badge"></div></div><div class="r" style="margin-top:8px"><div class="skeleton skeleton-text-short" style="margin:0"></div></div></div>';
            }
            $("results").innerHTML = html;
            $("results").style.display = "block";
        }

        // ===== 검색 (디바운스 + 스켈레톤) =====
        var _searchTimer = null;
        function doSearch(){
            var q = $("search-input").value.trim().toLowerCase();
            if(!q){$("results").style.display="none";return}
            
            showSkeleton(3);
            
            clearTimeout(_searchTimer);
            _searchTimer = setTimeout(function(){
                var f = D.filter(function(a){return a.n.toLowerCase().indexOf(q)>=0||a.r.toLowerCase().indexOf(q)>=0||a.c.toLowerCase().indexOf(q)>=0});
                var html = "";
                if(!f.length){html='<div style="padding:16px;text-align:center;color:var(--t3)">😅 검색 결과가 없습니다</div>'}
                else{
                    f.forEach(function(a){
                        var c=CC[a.c]||"#e8b44f";
                        html+='<div class=result-item onclick="showDetail('+D.indexOf(a)+')"><div class=t><h3>'+a.n+'</h3><span class=badge style=background:'+c+'>'+a.c+'</span></div><div class=r><span>📍 '+a.r+'</span></div></div>';
                    });
                }
                $("results").innerHTML=html;
            }, 400);
        }

        $("search-btn").addEventListener("click",function(){
            var q = $("search-input").value.trim();
            if(q) doSearch();
        });
        $("search-input").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
        $("search-input").addEventListener("input",function(){clearTimeout(dt);dt=setTimeout(doSearch,300)});
        var dt;
        $("results").addEventListener("click",function(e){e.stopPropagation()});
        document.addEventListener("click",function(){$("results").style.display="none"});

        // ===== 필터 =====
        document.querySelectorAll(".filter-btn").forEach(function(btn){
            btn.addEventListener("click",function(){
                document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});
                this.classList.add("active");
                catFilter = this.getAttribute("data-cat");
                markers.forEach(function(m){
                    var a = D[m._idx];
                    if(catFilter === "all") m.setOpacity(1);
                    else m.setOpacity(a.c === catFilter ? 1 : 0.25);
                });
            });
        });

        // ===== 상세 패널 =====
        function showDetail(i){
            _selIdx = i;
            var a = D[i], c = CC[a.c]||"#e8b44f";
            $("dt-cat").textContent = a.c; $("dt-cat").style.background = c;
            $("dt-name").textContent = a.n;
            $("dt-region").textContent = "📍 " + a.r;
            $("dt-desc").textContent = a.d;
            $("dt-tip").innerHTML = "<b>💡 여행 팁</b><br>" + a.t;
            $("dt-navi").href = "https://map.naver.com/p/directions/"+a.a+","+a.o+","+encodeURIComponent(a.n)+"?c="+a.o+","+a.a+",15,0,0,0,dh";
            $("dt-coords").textContent = "📌 "+a.a+", "+a.o;
            var isW = _wish.indexOf(i) >= 0;
            $("dt-wish").textContent = isW ? "❤️ 찜 완료" : "🤍 찜하기";
            $("detail-overlay").style.display = "block";
            $("detail-panel").classList.add("open");
        }

        function closeDetail(){
            $("detail-overlay").style.display = "none";
            $("detail-panel").classList.remove("open");
        }

        function toggleWish(){
            if(_selIdx < 0) return;
            var idx = _wish.indexOf(_selIdx);
            if(idx >= 0){_wish.splice(idx,1);$("dt-wish").textContent = "🤍 찜하기";}
            else {_wish.push(_selIdx);$("dt-wish").textContent = "❤️ 찜 완료";}
            localStorage.setItem("ktour_wish", JSON.stringify(_wish));
        }

        _checkInstall();
        window.addEventListener("beforeinstallprompt", function(e){
            e.preventDefault();
            _installEvent = e;
            $("install-banner").style.display = "flex";
            document.getElementById("install-btn2").style.display = "flex"
        });
        $("install-btn").addEventListener("click", function(){
            if(!_installEvent) return;
            _installEvent.prompt();
            _installEvent.userChoice.then(function(){$("install-banner").style.display = "none"});
        });

        window.addEventListener("resize",function(){map.invalidateSize()});
    </script>
