<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>관리자 대시보드 - 대한민국 관광명소</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root{
            --bg:#f0efec;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
            --border:#e5e3dd;--accent:#e74c3c;--accent2:#f97316;
            --shadow:0 2px 12px rgba(0,0,0,0.05);--shadow-hover:0 6px 24px rgba(0,0,0,0.08);
            --radius:14px;--radius-sm:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Noto Sans KR',-apple-system,sans-serif;
            background:var(--bg);color:var(--text);
            display:flex;min-height:100vh;
        }

        /* 사이드바 */
        #sidebar{
            width:240px;background:var(--card);
            border-right:1px solid var(--border);
            padding:24px 16px;
            position:fixed;top:0;left:0;bottom:0;
            display:flex;flex-direction:column;
            z-index:100;
        }
        #sidebar .logo{font-size:18px;font-weight:900;margin-bottom:28px;padding:0 8px;letter-spacing:-0.5px}
        #sidebar .logo span{color:var(--accent)}
        #sidebar nav{display:flex;flex-direction:column;gap:4px}
        #sidebar nav a{
            padding:10px 12px;border-radius:var(--radius-sm);
            text-decoration:none;color:var(--text2);font-size:14px;font-weight:500;
            transition:all 0.2s;cursor:pointer;display:flex;align-items:center;gap:10px;
        }
        #sidebar nav a:hover{background:var(--bg);color:var(--text)}
        #sidebar nav a.active{background:var(--accent);color:#fff}
        #sidebar .footer{
            margin-top:auto;padding:12px 8px 0;
            border-top:1px solid var(--border);
            font-size:12px;color:var(--text3);
        }
        #sidebar .footer a{color:var(--accent);text-decoration:none}

        /* 메인 */
        #main{
            margin-left:240px;
            flex:1;padding:28px 32px;
            max-width:calc(100vw - 240px);
        }
        #main h2{font-size:22px;font-weight:700;margin-bottom:4px}
        #main .sub{font-size:14px;color:var(--text2);margin-bottom:24px}

        /* 통계 카드 */
        .stats{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:14px;margin-bottom:28px;
        }
        .stat-card{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:18px 20px;
            box-shadow:var(--shadow);
        }
        .stat-card .num{font-size:28px;font-weight:900;margin-bottom:2px}
        .stat-card .label{font-size:13px;color:var(--text2);font-weight:400}
        .stat-card .num.historical{color:#e74c3c}
        .stat-card .num.nature{color:#2ecc71}
        .stat-card .num.culture{color:#9b59b6}
        .stat-card .num.food{color:#f59e0b}
        .stat-card .num.etc{color:#3498db}

        /* 차트 영역 */
        .charts{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;margin-bottom:28px;
        }
        .chart-box{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:18px 20px;
            box-shadow:var(--shadow);
        }
        .chart-box h4{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text2)}
        .chart-box canvas{max-height:220px}

        /* 테이블 */
        .table-wrap{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            overflow:hidden;
        }
        .table-head{
            display:flex;justify-content:space-between;align-items:center;
            padding:16px 20px;border-bottom:1px solid var(--border);
        }
        .table-head h4{font-size:15px;font-weight:600}
        .table-head .add-btn{
            padding:7px 18px;border:none;border-radius:var(--radius-sm);
            background:var(--accent);color:#fff;font-size:12px;font-weight:600;
            cursor:pointer;font-family:inherit;transition:background 0.2s;
        }
        .table-head .add-btn:hover{background:#c0392b}

        .table-scroll{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{
            text-align:left;padding:10px 16px;
            font-weight:600;color:var(--text2);font-size:12px;
            border-bottom:1px solid var(--border);
            white-space:nowrap;
        }
        td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
        tr:last-child td{border-bottom:none}
        tr:hover td{background:#fafaf9}
        td .badge{
            display:inline-block;padding:2px 8px;border-radius:999px;
            font-size:10px;font-weight:600;color:#fff;
        }
        td .act-btn{
            padding:4px 12px;border:none;border-radius:6px;
            font-size:11px;font-weight:500;cursor:pointer;
            font-family:inherit;transition:all 0.2s;
            margin-right:4px;
        }
        td .edit-btn{background:#f0efec;color:var(--text)}
        td .edit-btn:hover{background:#e5e3dd}
        td .del-btn{background:#fef2f2;color:#e74c3c}
        td .del-btn:hover{background:#fee2e2}
        .name-cell{font-weight:600}

        /* 모달 */
        #modal{
            display:none;
            position:fixed;inset:0;
            z-index:1000;
            background:rgba(0,0,0,0.3);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            align-items:center;justify-content:center;
        }
        #modal.show{display:flex}
        #modal .modal-box{
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:0 20px 60px rgba(0,0,0,0.15);
            width:92%;max-width:520px;
            max-height:90vh;
            overflow-y:auto;
            padding:28px 24px 24px;
        }
        #modal .modal-box h3{font-size:18px;font-weight:700;margin-bottom:16px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
        .form-group input,.form-group select,.form-group textarea{
            width:100%;padding:9px 12px;
            border:1px solid var(--border);border-radius:var(--radius-sm);
            font-size:13px;font-family:inherit;color:var(--text);
            background:var(--bg);outline:none;transition:border-color 0.2s;
        }
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
            border-color:var(--accent);
        }
        .form-group textarea{resize:vertical;min-height:60px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
        .modal-actions button{
            padding:9px 22px;border:none;border-radius:var(--radius-sm);
            font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s;
        }
        .modal-actions .cancel{background:var(--bg);color:var(--text2)}
        .modal-actions .cancel:hover{background:#e5e3dd}
        .modal-actions .save{background:var(--accent);color:#fff}
        .modal-actions .save:hover{background:#c0392b}

        /* 알림 토스트 */
        #toast{
            position:fixed;top:20px;right:20px;
            z-index:9999;
            background:#1a1a2e;color:#fff;
            padding:12px 20px;border-radius:var(--radius-sm);
            font-size:13px;font-weight:500;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            transform:translateX(120%);
            transition:transform 0.3s ease;
            max-width:360px;
        }
        #toast.show{transform:translateX(0)}

        /* 반응형 */
        @media(max-width:768px){
            #sidebar{width:100%;position:relative;padding:16px 12px;border-right:none;border-bottom:1px solid var(--border)}
            #sidebar .logo{font-size:16px;margin-bottom:16px}
            #sidebar nav{flex-direction:row;flex-wrap:wrap}
            #sidebar .footer{display:none}
            #main{margin-left:0;padding:16px 14px;max-width:100%}
            .charts{grid-template-columns:1fr}
            .stats{grid-template-columns:repeat(2,1fr)}
            #modal .modal-box{padding:20px 16px}
            .form-row{grid-template-columns:1fr}
        }
        @media(max-width:480px){
            .stats{grid-template-columns:1fr}
            th,td{padding:8px 10px;font-size:12px}
        }
    </style>
</head>
<body>
    <!-- 사이드바 -->
    <div id="sidebar">
        <div class="logo">🇰🇷 K<span>-travel</span></div>
        <nav>
            <a class="active" onclick="showTab('dashboard')">📊 대시보드</a>
            <a onclick="showTab('manage')">📝 명소 관리</a>
            <a href="/" target="_blank">🗺️ 지도 보기</a>
        </nav>
        <div class="footer">
            관리자 대시보드 v1.0<br>
            <a href="/" target="_blank">tourist-attractions-korea</a>
        </div>
    </div>

    <!-- 메인 -->
    <div id="main">
        <div id="dashboard-tab">
            <h2>📊 대시보드</h2>
            <div class="sub">관광명소 데이터 현황 및 통계</div>

            <div class="stats">
                <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">총 명소</div></div>
                <div class="stat-card"><div class="num historical" id="stat-historical">0</div><div class="label">역사/궁궐</div></div>
                <div class="stat-card"><div class="num nature" id="stat-nature">0</div><div class="label">자연/관광</div></div>
                <div class="stat-card"><div class="num culture" id="stat-culture">0</div><div class="label">문화/전통</div></div>
                <div class="stat-card"><div class="num food" id="stat-food">0</div><div class="label">맛집/시장</div></div>
                <div class="stat-card"><div class="num etc" id="stat-etc">0</div><div class="label">기타</div></div>
            </div>

            <div class="charts">
                <div class="chart-box">
                    <h4>카테고리별 분포</h4>
                    <canvas id="chart-category"></canvas>
                </div>
                <div class="chart-box">
                    <h4>지역별 분포</h4>
                    <canvas id="chart-region"></canvas>
                </div>
            </div>

            <div class="chart-box" style="margin-bottom:28px">
                <h4>최근 업데이트 로그</h4>
                <div id="activity-log" style="font-size:13px;color:var(--text2);line-height:2">
                    데이터를 불러오는 중...
                </div>
            </div>
        </div>

        <div id="manage-tab" style="display:none">
            <h2>📝 명소 관리</h2>
            <div class="sub">관광명소 데이터를 추가/수정/삭제할 수 있습니다</div>

            <div class="table-wrap">
                <div class="table-head">
                    <h4>명소 목록 (<span id="list-count">0</span>)</h4>
                    <button class="add-btn" onclick="openModal()">+ 새 명소</button>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>명소명</th>
                                <th>지역</th>
                                <th>카테고리</th>
                                <th>위도</th>
                                <th>경도</th>
                                <th style="width:100px">관리</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="modal">
        <div class="modal-box">
            <h3 id="modal-title">새 명소 추가</h3>
            <div class="form-row">
                <div class="form-group"><label>명소명</label><input id="f-name" placeholder="예: 경복궁"></div>
                <div class="form-group"><label>지역</label><input id="f-region" placeholder="예: 서울"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>위도</label><input id="f-lat" type="number" step="0.0001" placeholder="37.5796"></div>
                <div class="form-group"><label>경도</label><input id="f-lng" type="number" step="0.0001" placeholder="126.9770"></div>
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <select id="f-cat">
                    <option>궁궐/역사</option><option>랜드마크</option><option>문화/전통</option>
                    <option>쇼핑/거리</option><option>문화/거리</option><option>쇼핑/업무</option>
                    <option>자연/섬</option><option>자연/산</option><option>자연/명소</option>
                    <option>해변/휴양</option><option>문화/마을</option><option>맛집/시장</option>
                    <option>역사/유적</option><option>사찰/역사</option><option>전통/마을</option>
                    <option>공원/전시</option><option>자연/공원</option><option>문화/전시</option>
                    <option>테마파크</option><option>역사/평화</option><option>역사/기념관</option>
                    <option>역사/문화</option><option>자연/호수</option><option>자연/동굴</option>
                </select>
            </div>
            <div class="form-group"><label>설명</label><textarea id="f-desc" placeholder="명소에 대한 설명을 입력하세요"></textarea></div>
            <div class="form-group"><label>여행 팁</label><textarea id="f-tip" placeholder="방문객을 위한 팁을 입력하세요"></textarea></div>
            <div class="modal-actions">
                <button class="cancel" onclick="closeModal()">취소</button>
                <button class="save" id="modal-save-btn" onclick="saveAttraction()">저장</button>
            </div>
        </div>
    </div>

            {name:"인천차이나타운",region:"인천",lat:37.4778,lng:126.6190,cat:"문화/거리",desc:"한국 최초 차이나타운",tip:"짜장면 박물관 방문!"},
            {name:"광주국립아시아문화전당",region:"광주",lat:35.1467,lng:126.9184,cat:"문화/전시",desc:"아시아 문화 교류 중심",tip:"무료 전시 많음"},
            {name:"설악산국립공원",region:"강원",lat:38.1195,lng:128.4642,cat:"자연/산",desc:"한국의 알프스, 웅장한 암봉",tip:"케이블카 타고 권금성까지!"},
            {name:"남해군",region:"경남",lat:34.8140,lng:127.9289,cat:"자연/섬",desc:"다도해 아름다운 풍경",tip:"독일마을에서 이국적 풍경!"},
            {name:"통영케이블카",region:"경남",lat:34.8315,lng:128.4227,cat:"자연/명소",desc:"한려해상국립공원 케이블카",tip:"스카이워크도 체험!"},
            {name:"순천만국가정원",region:"전남",lat:34.9258,lng:127.4947,cat:"자연/공원",desc:"세계적 생태 관광지",tip:"일몰 갈대밭 황금빛!"},
            {name:"제부도",region:"경기",lat:37.1945,lng:126.6313,cat:"자연/섬",desc:"하루 두 번 바닷길 열리는 섬",tip:"물때표 확인 필수!"},
            {name:"용인에버랜드",region:"경기",lat:37.2935,lng:127.2070,cat:"테마파크",desc:"한국 최대 테마파크",tip:"주말 예약 필수!"},
            {name:"포항죽도시장",region:"경북",lat:36.0180,lng:129.3657,cat:"맛집/시장",desc:"과메기와 물회 본고장",tip:"과메기 정식 필수!"},
            {name:"속초관광수산시장",region:"강원",lat:38.2072,lng:128.5921,cat:"맛집/시장",desc:"강원도 대표 시장",tip:"닭강정과 오징어순대!"},
            {name:"철원 DMZ",region:"강원",lat:38.2220,lng:127.2140,cat:"역사/평화",desc:"한반도 분단 현장",tip:"출입증 필요!"},
            {name:"천안독립기념관",region:"충남",lat:36.7803,lng:127.2217,cat:"역사/기념관",desc:"한국 독립운동 역사 기념관",tip:"입장료 무료!"},
            {name:"공주무령왕릉",region:"충남",lat:36.4613,lng:127.1178,cat:"역사/유적",desc:"백제 시대 왕릉, 귀중 유물 출토",tip:"국립공주박물관 유물 전시"},
            {name:"부여백제문화단지",region:"충남",lat:36.2748,lng:126.9127,cat:"역사/문화",desc:"백제 역사 재현 테마파크",tip:"부소산성도 함께!"},
            {name:"충주호",region:"충북",lat:36.9712,lng:128.0019,cat:"자연/호수",desc:"청풍호반과 유람선 호수",tip:"유람선 타고 호수 둘러보기!"},
            {name:"단양고수동굴",region:"충북",lat:36.9578,lng:128.3630,cat:"자연/동굴",desc:"천연동굴 신비 체험",tip:"도담삼봉도 함께!"},
        ];

        // 데이터 관리
        let data = [];
        let editIdx = -1;
        let chartCat = null, chartReg = null;

        function loadData(){
            const saved = localStorage.getItem("ktour_data");
            if(saved) data = JSON.parse(saved);
            else { data = JSON.parse(JSON.stringify(defaultData)); saveData(); }
            updateAll();
        }
        function saveData(){ localStorage.setItem("ktour_data", JSON.stringify(data)); }
        function toast(msg){
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(()=>t.classList.remove("show"), 2500);
        }

        // 통계 & 차트
        function updateAll(){
            updateStats();
            updateCharts();
            updateTable();
            updateLog();
            document.getElementById("list-count").textContent = data.length;
        }

        function updateStats(){
            const c = {total:data.length, historical:0, nature:0, culture:0, food:0, etc:0};
            data.forEach(a=>{
                const cat = a.cat || "";
                if(cat.includes("궁궐")||cat.includes("역사")||cat.includes("사찰")||cat.includes("전통")||cat.includes("기념관")) c.historical++;
                else if(cat.includes("자연")||cat.includes("해변")||cat.includes("공원")||cat.includes("호수")||cat.includes("동굴")||cat.includes("섬")) c.nature++;
                else if(cat.includes("문화")||cat.includes("랜드마크")||cat.includes("테마")) c.culture++;
                else if(cat.includes("맛집")||cat.includes("시장")) c.food++;
                else c.etc++;
            });
            document.getElementById("stat-total").textContent = c.total;
            document.getElementById("stat-historical").textContent = c.historical;
            document.getElementById("stat-nature").textContent = c.nature;
            document.getElementById("stat-culture").textContent = c.culture;
            document.getElementById("stat-food").textContent = c.food;
            document.getElementById("stat-etc").textContent = c.etc;
        }

        function updateCharts(){
            // 카테고리
            const catMap = {};
            data.forEach(a=>{ const k = a.cat||"기타"; catMap[k] = (catMap[k]||0) + 1; });
            const labels = Object.keys(catMap).slice(0,8);
            const vals = labels.map(k=>catMap[k]);
            if(chartCat) chartCat.destroy();
            chartCat = new Chart(document.getElementById("chart-category"), {
                type:"doughnut",
                data:{labels, datasets:[{data:vals, backgroundColor:["#e74c3c","#f97316","#2ecc71","#9b59b6","#3498db","#f59e0b","#1abc9c","#8b5cf6"]}]},
                options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}
            });
            // 지역
            const regMap = {};
            data.forEach(a=>{ const k = a.region||"기타"; regMap[k] = (regMap[k]||0) + 1; });
            const rLabels = Object.keys(regMap).sort((a,b)=>regMap[b]-regMap[a]).slice(0,8);
            const rVals = rLabels.map(k=>regMap[k]);
            if(chartReg) chartReg.destroy();
            chartReg = new Chart(document.getElementById("chart-region"), {
                type:"bar",
                data:{labels:rLabels, datasets:[{label:"명소 수",data:rVals, backgroundColor:"#e74c3c", borderRadius:4}]},
                options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}}
            });
        }

        function updateLog(){
            const log = JSON.parse(localStorage.getItem("ktour_log") || "[]");
            const el = document.getElementById("activity-log");
            if(!log.length){ el.innerHTML = "<span style=\'color:var(--text3)\'>아직 활동 기록이 없습니다.</span>"; return; }
            el.innerHTML = log.slice().reverse().slice(0,20).map(l=>`<div>${l.time} - ${l.msg}</div>`).join("");
        }

        function addLog(msg){
            const log = JSON.parse(localStorage.getItem("ktour_log") || "[]");
            const now = new Date();
            const time = now.toLocaleDateString()+" "+now.toLocaleTimeString();
            log.push({time, msg});
            if(log.length>100) log.splice(0,log.length-100);
            localStorage.setItem("ktour_log", JSON.stringify(log));
        }

        // 테이블
        function updateTable(){
            const tb = document.getElementById("table-body");
            tb.innerHTML = data.map((a,i)=>{
                const color = getCatColor(a.cat);
                return `<tr><td class="name-cell">${a.name}</td><td>${a.region}</td><td><span class="badge" style="background:${color}">${a.cat||"-"}</span></td><td>${a.lat}</td><td>${a.lng}</td><td><button class="act-btn edit-btn" onclick="editItem(${i})">✏️</button><button class="act-btn del-btn" onclick="deleteItem(${i})">🗑️</button></td></tr>`;
            }).join("");
        }

        function getCatColor(cat){
            const m={"궁궐/역사":"#e74c3c","랜드마크":"#f97316","문화/전통":"#2ecc71","쇼핑/거리":"#9b59b6","문화/거리":"#ec4899","쇼핑/업무":"#1abc9c","자연/섬":"#3498db","자연/산":"#27ae60","자연/명소":"#1abc9c","해변/휴양":"#00bcd4","문화/마을":"#ff5722","맛집/시장":"#f59e0b","역사/유적":"#8d6e63","사찰/역사":"#fbbf24","전통/마을":"#4caf50","공원/전시":"#2196f3","자연/공원":"#009688","문화/전시":"#8b5cf6","테마파크":"#ff4081","역사/평화":"#795548","역사/기념관":"#607d8b","역사/문화":"#84cc16","자연/호수":"#06b6d4","자연/동굴":"#795548"};
            return m[cat]||"#9ca3af";
        }

        // CRUD
        function openModal(idx){
            editIdx = idx !== undefined ? idx : -1;
            document.getElementById("modal-title").textContent = editIdx>=0 ? "명소 수정" : "새 명소 추가";
            document.getElementById("modal-save-btn").textContent = editIdx>=0 ? "수정" : "추가";
            if(editIdx>=0){
                const a = data[editIdx];
                document.getElementById("f-name").value = a.name;
                document.getElementById("f-region").value = a.region;
                document.getElementById("f-lat").value = a.lat;
                document.getElementById("f-lng").value = a.lng;
                document.getElementById("f-cat").value = a.cat;
                document.getElementById("f-desc").value = a.desc;
                document.getElementById("f-tip").value = a.tip||"";
            } else {
                ["f-name","f-region","f-lat","f-lng","f-desc","f-tip"].forEach(id=>document.getElementById(id).value="");
                document.getElementById("f-cat").value = "궁궐/역사";
            }
            document.getElementById("modal").classList.add("show");
        }

        function closeModal(){ document.getElementById("modal").classList.remove("show"); }

        function saveAttraction(){
            const name = document.getElementById("f-name").value.trim();
            const region = document.getElementById("f-region").value.trim();
            const lat = parseFloat(document.getElementById("f-lat").value);
            const lng = parseFloat(document.getElementById("f-lng").value);
            const cat = document.getElementById("f-cat").value;
            const desc = document.getElementById("f-desc").value.trim();
            const tip = document.getElementById("f-tip").value.trim();

            if(!name||!region||isNaN(lat)||isNaN(lng)||!desc){
                toast("⚠️ 모든 필수 항목을 입력해주세요."); return;
            }

            const obj = {name,region,lat,lng,cat,desc,tip};

            if(editIdx>=0){
                data[editIdx] = obj;
                addLog(`✏️ "${name}" 수정됨`);
                toast("✅ 수정 완료!");
            } else {
                data.push(obj);
                addLog(`➕ "${name}" 추가됨`);
                toast("✅ 추가 완료!");
            }

            saveData();
            updateAll();
            closeModal();
        }

        function editItem(idx){ openModal(idx); }

        function deleteItem(idx){
            const name = data[idx].name;
            if(!confirm(`"${name}"을(를) 삭제하시겠습니까?`)) return;
            data.splice(idx,1);
            saveData();
            addLog(`🗑️ "${name}" 삭제됨`);
            toast("🗑️ 삭제 완료!");
            updateAll();
        }

        // 탭
        function showTab(tab){
            document.querySelectorAll("#sidebar nav a").forEach(a=>a.classList.remove("active"));
            event.target.classList.add("active");
            document.getElementById("dashboard-tab").style.display = tab==="dashboard" ? "block" : "none";
            document.getElementById("manage-tab").style.display = tab==="manage" ? "block" : "none";
            if(tab==="dashboard"){ updateCharts(); updateLog(); }
            if(tab==="manage") updateTable();
        }

        // 모달 외부 클릭 닫기
        document.getElementById("modal").addEventListener("click", function(e){
            if(e.target===this) closeModal();
        });

        loadData();
    </script>
</body>
</html>
